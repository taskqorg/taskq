<!doctype html>
<!-- `taskq tray` popover (taskq.md § 4): docs/design/workspace-prototype.html routes driven by the Rust bridge in tray.rs.
     Rust calls taskq.receive(state); actions go back through window.ipc.postMessage(JSON). -->
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#243039,#eef2f5);--surface:light-dark(#fafbfc,#252b32);--muted:light-dark(#59636e,#b9c3cd);--edge:light-dark(#dce0e5,#46505b);--work:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);--ready:light-dark(#5d6874,#c8d0d9);--failed:light-dark(#a6324b,#ee96a5);background:var(--surface);-webkit-user-select:none;user-select:none;cursor:default}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:transparent}
/* a window a fraction of a pixel short of the measured width reflows instead of scrolling horizontally (#1073) */
body{max-width:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px 7px}
a{color:inherit;text-decoration:none}
.menu{font-size:var(--size,16px);height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-radius:0 0 9px 9px}.menu[data-edge=bottom]{border-radius:9px 9px 0 0}.menu[data-edge=left]{border-radius:0 9px 9px 0}.menu[data-edge=right]{border-radius:9px 0 0 9px}.menu.pinned{border-radius:9px}.content{min-height:0;overflow-y:auto;overflow-x:clip;scrollbar-width:thin;overscroll-behavior:contain;padding:6px 8px;flex:1}
.row,summary{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:32px;padding:5px 4px;line-height:1.35}
summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) 8px;gap:6px}
summary>.meta,summary>.counter{justify-self:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hist>summary>.meta{white-space:normal;overflow:visible;text-align:right}
summary::-webkit-details-marker{display:none}
summary:after{content:'›';color:var(--muted);grid-column:3}
details[open]>summary:after{transform:rotate(90deg)}
.muted,.meta{color:var(--muted);font-size:max(12px,.85em)}
.group{border-top:1px solid var(--edge);margin-top:5px;padding-top:5px}
.body{padding:5px 4px;line-height:1.45;overflow-wrap:anywhere}
.project:hover,.project:focus-visible{background:light-dark(#e9edf1,#37424c)}
.project{width:100%;border:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;text-align:left;min-height:33px;padding:5px 4px}
.project>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;font-size:max(12px,.8em);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
.counter.filled{background:color-mix(in srgb,currentColor 12%,var(--surface))}
.counter.zero{color:var(--muted);background:light-dark(#eff1f3,#2b3138)}
.work{color:var(--work)}.ask{color:var(--ask)}.ready{color:var(--ready)}.failed{color:var(--failed)}
.options{display:flex;gap:5px;flex-wrap:wrap;padding:4px}
.options button{flex:1 0 38px}.options [data-a^=notify]{flex-basis:auto;padding-inline:4px}
.options button.rec{border-color:var(--work);font-weight:600}
button[aria-pressed=true]{background:light-dark(#dce7e1,#354a40);border-color:var(--work)}
.periods button{flex:1 0 auto;padding:4px 6px}
.views button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;font-size:.9em}
.views img{height:18px}
button:disabled{color:var(--muted);opacity:.75}
.alert{color:var(--failed)}
.toast{position:fixed;left:8px;right:8px;bottom:8px;z-index:12;padding:6px 8px;border:1px solid var(--work);border-radius:8px;background:var(--surface);box-shadow:0 4px 14px #0006;overflow-wrap:anywhere}.toast button{margin-left:6px}
h1{font-size:1em;margin:6px 4px;overflow-wrap:anywhere}.footer{border-top:1px solid var(--edge);margin-top:6px}
.head{flex-shrink:0;z-index:10;background:light-dark(#edf0f3,#303840);min-height:32px;padding:3px 8px;cursor:grab}.head nav,.window-controls{display:flex;gap:4px}.pin-glyph{display:inline-block}.head button{padding:2px 7px}.grip{position:fixed;right:0;bottom:0;width:18px;height:18px;z-index:11;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--muted) 56%,var(--muted) 62%,transparent 63%,transparent 75%,var(--muted) 76%,var(--muted) 82%,transparent 83%)}
/* Home keeps a bounded preview of the AI exchange and of the proposed changes (menu.md M7); controls stay below them */
.askai{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:4px}
.askai textarea{font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px;resize:vertical;min-width:0;-webkit-user-select:text;user-select:text}
.askai button{align-self:start;min-width:34px}
.bars{display:flex;align-items:flex-end;justify-content:flex-start;margin:0 4px}
.menu .hist .bars button{min-width:0;flex:none;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-height:0;padding:0;border:0;border-radius:0;background:none}
.menu .bars button[aria-pressed=true]{background:none;outline:none}.menu .bars button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.bars i{display:block;flex-shrink:0}.bars i.k0{background:var(--work)}.bars i.k1{background:var(--failed)}.bars i.k2{background:var(--ask)}.bars i.k3{background:var(--ready)}
.bars button.unknown{outline:1px dashed var(--edge);outline-offset:-1px}
.history-legend{display:flex;flex-wrap:wrap;gap:4px 12px}.history-legend span{white-space:nowrap}.history-legend i{display:inline-block;width:8px;height:8px;margin-right:4px;background:currentColor}
.range{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;padding:4px}
.range input,.range select{font:inherit;font-size:.9em;min-width:0;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:3px}
.recovery-evidence{display:block;margin-top:.4em}.recovery-evidence input{display:block;box-sizing:border-box;width:100%;font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px;margin-top:3px}.recovery-evidence input:disabled{opacity:.6}
@media(pointer:coarse){button,summary{min-height:44px}}
.tqp-counts button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
/* #1523: margins stay inside the measured content body; the row menu ends the task's top line and opens below it */
.content-body{display:flow-root}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.task-row>.row-menu{grid-column:2;grid-row:1;border:0;padding:4px}
.task-row>.row-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 5px}
.row-actions .task-controls{display:contents}
</style><style>{{ANSWER_CARD_CSS}}</style><style>{{PROJECT_BLOCKS_CSS}}</style><style>{{RESOURCE_CONTROLS_CSS}}</style></head><body><div class="menu" role="menu"></div>
<script>{{GUARD_JS}}</script><script>{{APP_JS}}</script>
</body></html>
