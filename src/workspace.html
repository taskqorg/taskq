<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><style>
:root{color-scheme:light dark;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#243039,#eef2f5);background:light-dark(#fafbfc,#252b32);--edge:light-dark(#ccd3da,#53616e);--muted:light-dark(#4e5c67,#bac6ce)}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select,summary{font:inherit;color:inherit}button,input,textarea,select{background:light-dark(#fff,#303943);border:1px solid var(--edge);border-radius:5px;padding:8px}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid light-dark(#246f59,#8dd2b8);outline-offset:1px}
.workspace{display:grid;grid-template-columns:minmax(170px,27%) minmax(0,1fr);height:100vh}aside{overflow:auto;padding:12px;border-right:1px solid var(--edge)}aside input,aside>button{width:100%;margin-bottom:8px}.conversation{text-align:left;display:grid;gap:5px}.conversation span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation[aria-current]{border:2px solid light-dark(#246f59,#8dd2b8)}main{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}header,.composer{padding:12px}header{border-bottom:1px solid var(--edge)}h1{font-size:1.1rem;margin:0 0 8px}h2{font-size:1rem;margin:0 0 6px}small{color:var(--muted)}.transcript{overflow:auto;padding:12px;overflow-wrap:anywhere}article{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:16px}.text,pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin:0 0 14px}pre{font:inherit;border-left:3px solid var(--edge);padding:8px}.composer{border-top:1px solid var(--edge);max-height:50vh;overflow:auto}textarea{display:block;width:100%;min-height:72px;resize:vertical;margin:8px 0}.actions,.review{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions details{min-width:0}.actions details button{display:block;max-width:100%;white-space:normal;text-align:left}p[role=alert]{color:light-dark(#a6324b,#ffafbe)}.narrow{display:none}@media(max-width:540px){.narrow{display:block;margin-bottom:8px}.workspace{display:block}.workspace aside{display:none}.workspace.list-open aside{display:block;height:100vh}.workspace.list-open main{display:none}main{height:100vh}}
</style></head><body><div class="workspace"></div><script>{{GUARD_JS}}</script><script>{{APP_JS}}</script></body></html>
