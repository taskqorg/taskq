name: Proposed native Windows dependency qualification
on:
  push:
    branches: [codex/qualify-msvc-98e9db36]
    paths: [.github/workflows/qualify-native-windows.yml]
permissions:
  contents: read
jobs:
  native-fixture-artifacts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e35972224c7f7ac7952be75f04f02550f1edc09f
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build ordinary TaskQ and separate native test harness
        shell: python
        env:
          RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-msvc
        run: |
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess,traceback
          base='e35972224c7f7ac7952be75f04f02550f1edc09f';new_pin='147d030711776227e5fe2fc5cab378601997deeace6555058474df30d41686bb';old_pin='af65880153a66852d72edf1d2a22faf191abeee2ad3d9cd6e8ee1d59183b8cc4';assert re.fullmatch('[0-9a-f]{64}',new_pin)
          sha=lambda p:hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          names=sorted(subprocess.check_output(['git','ls-files','-z'],text=True).strip('\0').split('\0'));assert len(names)==523
          hashes=lambda:{n:sha(Path(n)) for n in names}
          original=hashes();baseline={'source':base,'coreq':'8e6a9644976906271638569896b60949ed075ba3','version':'4.6.16','files':original};assert hashlib.sha256((json.dumps(baseline,indent=2)+'\n').encode()).hexdigest()=='17b4e84c0974b9da80489fa00d06bfda68e421d60d90bc4998b247e03c9a5ad6'
          source=Path('src/windows_sandbox.rs');text=source.read_text();assert text.count(old_pin)==1;source.write_bytes(text.replace(old_pin,new_pin).encode());files=hashes();assert [n for n in names if files[n]!=original[n]]==['src/windows_sandbox.rs']
          stage=Path(os.environ['RUNNER_TEMP'])/'taskq-native-stage';stage.mkdir();manifest={'base_source':base,'coreq':baseline['coreq'],'version':'4.6.16','proposed_codex_sha256':new_pin,'source_overrides':['src/windows_sandbox.rs'],'files':files};raw=(json.dumps(manifest,indent=2)+'\n').encode();(stage/'candidate-manifest.json').write_bytes(raw)
          result={'passed':False,'scope':'proposed pin overlay for scoped native qualification only, not final delivery source or canonical CI','base_source':base,'coreq':baseline['coreq'],'proposed_codex_sha256':new_pin,'candidate_manifest_sha256':hashlib.sha256(raw).hexdigest(),'source_overrides':manifest['source_overrides'],'target':'x86_64-pc-windows-msvc','rustc':subprocess.check_output(['rustc','-vV'],text=True),'cargo':subprocess.check_output(['cargo','-V'],text=True)}
          try:
              subprocess.run(['cargo','build','--release','--locked','--bin','taskq'],check=True)
              normal=stage/'taskq.exe';shutil.copy2('target/release/taskq.exe',normal);result['normal_sha256']=sha(normal)
              output=subprocess.run(['cargo','test','--release','--locked','--no-run','--bin','taskq','--message-format=json'],check=True,capture_output=True,text=True);(stage/'harness-build.log').write_text(output.stdout+'\n'+output.stderr)
              rows=[json.loads(line) for line in output.stdout.splitlines() if line.startswith('{')];bins=[Path(v['executable']) for v in rows if v.get('reason')=='compiler-artifact' and v.get('target',{}).get('name')=='taskq' and v.get('profile',{}).get('test') and v.get('executable')];assert len(bins)==1
              harness=stage/'taskq-native-tests.exe';shutil.copy2(bins[0],harness);result['harness_sha256']=sha(harness);assert result['harness_sha256']!=result['normal_sha256']
              smoke=Path(os.environ['RUNNER_TEMP'])/'native-taskq-offline-smoke';smoke.mkdir();env=dict(os.environ,TASKQ_INSTALL=str(smoke),TASKQ_SELFTEST_OFFLINE='1',TASKQ_INCIDENT_REPORTS='off');result['selftest']=subprocess.run([str(normal),'selftest'],env=env,capture_output=True,text=True,check=True,timeout=60).stdout
              exported=subprocess.run([str(normal),'profile','export'],env=env,capture_output=True,text=True,check=True,timeout=60).stdout;rows=[json.loads(line) for line in exported.splitlines()[1:]];assert rows and all(row['observation']['version']=='4.6.16' for row in rows);result['committed_rows']=len(rows)
              assert hashes()==files;assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['src/windows_sandbox.rs'];assert not list(stage.glob('*.dll'));result['passed']=True
          except Exception:result['error']=traceback.format_exc()
          finally:(stage/'provenance.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['passed'],result.get('error')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-f90-proposed
          path: ${{ runner.temp }}/taskq-native-stage
          retention-days: 14
          if-no-files-found: error
