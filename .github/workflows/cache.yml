# docs/testing.md: main pushes run no tests; this saves the per-OS Rust cache that tests.yml PR and merge_group runs restore.
name: cache
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cache
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # docs/testing.md: macOS warms the self-hosted runner that tests.yml merge_group runs use.
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted", "macOS", "ARM64", "taskq-mac"]') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # docs/testing.md: rustup restores the self-hosted runner's toolchain when cargo is missing.
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: command -v cargo >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          cache-bin: ${{ matrix.os != 'macos-latest' }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: cargo +stable test --locked --no-run
  windows-gnu:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gnu
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo +stable-x86_64-pc-windows-gnu test --locked --bin taskq --no-run
