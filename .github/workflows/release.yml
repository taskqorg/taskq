# § 8 Release: a live push (a fast-forward to a tested main commit) tags the next unused vX.Y.Z on that commit
# (.github/release-tag.sh; a GITHUB_TOKEN tag starts no run), opens a draft release and stamps the version into the
# build; no version commit. Each OS publishes alone as soon as its build is attested and the exact-source tests pass
# (.github/release-publish.sh): its binary, then SHA256SUMS and latest.json merged with the other OSes'; the first
# OS done un-drafts the release, so hosts update before macos exists. linux also carries the answer card and
# resource controls assets, the telemetry sync wire fixture and field list, the status snapshot schema and fixture.
# Release files carry build provenance attestations; once all three OSes are in, the final SHA256SUMS is attested
# and README shots are dispatched for the tag. A failing selftest publishes nothing for its OS.
name: release
on:
  push:
    tags: ['v*']
    branches: [live]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            Cargo.toml
            .github/release-tag.sh
          sparse-checkout-cone-mode: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release-tag.sh >> "$GITHUB_OUTPUT"
      - name: Draft release
        if: steps.tag.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
  checks:
    needs: tag
    if: needs.tag.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require selected tests on the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: main
        run: python3 .github/release-check.py
  build-linux:
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      os: ubuntu-latest
      target: linux-x86_64
  build-windows:
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      os: windows-latest
      target: windows-x86_64
      ext: .exe
  build-macos:
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      os: macos-latest
      target: macos-aarch64
  publish-linux:
    needs: [tag, checks, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/release-index.py
            .github/release-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x86_64
          path: dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/taskq-*
      - name: Publish linux
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: .github/release-publish.sh "$TAG" dist
  publish-windows:
    needs: [tag, checks, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/release-index.py
            .github/release-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x86_64
          path: dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/taskq-*
      - name: Publish windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: .github/release-publish.sh "$TAG" dist
  publish-macos:
    needs: [tag, checks, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/release-index.py
            .github/release-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-aarch64
          path: dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/taskq-*
      - name: Publish macos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: .github/release-publish.sh "$TAG" dist
  seal:
    needs: [tag, publish-linux, publish-windows, publish-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    steps:
      - name: Final SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/SHA256SUMS
      # README shots of this release binary (#2024); a stale set arrives as a draft PR. GITHUB_TOKEN may dispatch.
      - name: README shots
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run shots.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
