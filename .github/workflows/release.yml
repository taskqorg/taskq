# § 8 Release: a live push (a fast-forward to a tested main commit) tags the next unused vX.Y.Z on that commit
# (.github/release-tag.sh; a GITHUB_TOKEN tag starts no run) and stamps it into the build; no version commit.
# linux and windows publish together as soon as both are built and the exact-source tests pass; macos joins the
# same release when its runner finishes, then README shots are dispatched for the tag. Each publish carries one
# binary per OS, SHA256SUMS and latest.json (.github/release-index.py); the first also the answer card and resource
# controls assets, the telemetry sync wire fixture and field list, the status snapshot schema and fixture.
# Release files and SHA256SUMS carry build provenance attestations. A failing selftest publishes nothing for its OS.
name: release
on:
  push:
    tags: ['v*']
    branches: [live]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            Cargo.toml
            .github/release-tag.sh
          sparse-checkout-cone-mode: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release-tag.sh >> "$GITHUB_OUTPUT"
  checks:
    needs: tag
    if: needs.tag.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require selected tests on the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: main
        run: python3 .github/release-check.py
  build:
    needs: tag
    if: needs.tag.outputs.tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
            ext: .exe
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      ext: ${{ matrix.ext }}
  build-macos:
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      os: macos-latest
      target: macos-aarch64
  publish:
    needs: [tag, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/release-index.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-x86_64'
          path: dist
          merge-multiple: true
      - env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: python3 .github/release-index.py "${TAG#v}" dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/taskq-*
            dist/SHA256SUMS
      - name: Publish linux and windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
  publish-macos:
    needs: [tag, publish, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/release-index.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-aarch64
          path: dist
      - name: Add macos to the published sums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          python3 .github/release-index.py "${TAG#v}" dist
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/taskq-*
            dist/SHA256SUMS
      # Binary first, then its sum, then latest.json: a host never reads a macos entry without both.
      - name: Publish macos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/taskq-* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist/latest.json --repo "$GITHUB_REPOSITORY" --clobber
      # README shots of this release binary (#2024); a stale set arrives as a draft PR. GITHUB_TOKEN may dispatch.
      - name: README shots
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run shots.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
