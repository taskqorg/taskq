name: Frozen Windows MSVC qualification
on:
  push:
    branches: [codex/qualify-msvc-98e9db36]
    paths: [.github/workflows/qualify-msvc.yml]
permissions:
  contents: read
jobs:
  ordinary-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 98e9db3645c8881096b29b3d5989eddd2f6943b3
          persist-credentials: false
      - run: rustup default stable-x86_64-pc-windows-msvc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Exact frozen source and ordinary build
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          source='98e9db3645c8881096b29b3d5989eddd2f6943b3'; coreq='b2ad795286a5f1dab7fd20dfcde0ae0407f79b48'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          names=sorted(subprocess.check_output(['git','ls-files','-z'],text=True).strip('\0').split('\0'))
          hashes=lambda:{n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          files=hashes(); assert len(files)==523
          manifest={'source':source,'coreq':coreq,'version':'4.6.15','files':files}
          raw=(json.dumps(manifest,indent=2)+'\n').encode()
          assert hashlib.sha256(raw).hexdigest()=='db763813a73f56e0bec80e4049ac5bc28128715ae35da7debd4919fc39df9a29'
          stage=Path(os.environ['RUNNER_TEMP'])/'taskq-msvc-artifact';stage.mkdir()
          (stage/'source-manifest.json').write_bytes(raw)
          result={'source':source,'coreq':coreq,'version':'4.6.15','manifest_sha256':'db763813a73f56e0bec80e4049ac5bc28128715ae35da7debd4919fc39df9a29','target':'x86_64-pc-windows-msvc','profile':'release','command':['cargo','build','--release','--locked'],'rustc':subprocess.check_output(['rustc','-vV'],text=True),'cargo':subprocess.check_output(['cargo','-V'],text=True),'passed':False}
          subprocess.run(result['command'],check=True)
          assert hashes()==files and not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          import shutil
          binary=stage/'taskq.exe';shutil.copy2('target/release/taskq.exe',binary)
          result['binary_sha256']=hashlib.sha256(binary.read_bytes()).hexdigest()
          smoke=Path(os.environ['RUNNER_TEMP'])/'taskq-msvc-smoke';smoke.mkdir()
          env=dict(os.environ,TASKQ_INSTALL=str(smoke),TASKQ_SELFTEST_OFFLINE='1',TASKQ_INCIDENT_REPORTS='off')
          run=subprocess.run([str(binary),'selftest'],env=env,capture_output=True,text=True,check=True,timeout=60)
          exported=subprocess.run([str(binary),'profile','export'],env=env,capture_output=True,text=True,check=True,timeout=60)
          rows=[json.loads(line) for line in exported.stdout.splitlines()[1:]]
          assert rows and all(row['observation']['version']=='4.6.15' for row in rows)
          result.update(passed=True,source_unchanged=True,selftest=run.stdout,committed_rows=len(rows),artifact_dlls=[p.name for p in stage.glob('*.dll')])
          assert not result['artifact_dlls']
          (stage/'provenance.json').write_bytes((json.dumps(result,indent=2)+'\n').encode())
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-98e9db36
          path: ${{ runner.temp }}/taskq-msvc-artifact
          retention-days: 14
          if-no-files-found: error
