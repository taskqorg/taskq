# § 7, docs/testing.md: PRs run Linux checks; merge_group runs the affected-OS matrix and gates publication; main pushes run none (cache.yml warms caches).
name: tests
on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  issues: read
env:
  CHECK_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || 'HEAD^' }}
  CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/check.py --plan >> "$GITHUB_OUTPUT"
      - run: git diff --check
      - run: python3 scripts/check.test.py
      # docs/design/rule-ids.md: changed rule IDs must be named by the task.
      - run: python3 scripts/check.py --rules
        env:
          GH_TOKEN: ${{ github.token }}
  rust:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Restore only; cache.yml saves it on main pushes, so PR and queue runs never churn it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: false
      - run: python3 scripts/check.py
  windows-gnu:
    needs: plan
    if: needs.plan.outputs.scope == 'full' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gnu
          save-if: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo +stable-x86_64-pc-windows-gnu test --locked --bin taskq platform::tests::installed_windows_release_starts_without_build_paths -- --exact --show-output
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rc=0; docs/shots/check.sh || rc=$?
          [ $rc = 2 ] && { echo '::warning::README shots are stale; run the README shots workflow'; exit 0; }
          exit $rc
  tests:
    needs: [plan, rust, windows-gnu, shots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          RUST: ${{ needs.rust.result }}
          GNU: ${{ needs.windows-gnu.result }}
          SHOTS: ${{ needs.shots.result }}
          FULL_GNU: ${{ github.event_name == 'pull_request' && 'skipped' || 'success' }}
        run: |
          test "$PLAN" = success && test "$SHOTS" = success
          case "$SCOPE" in
            docs) test "$RUST" = skipped && test "$GNU" = skipped ;;
            web) test "$RUST" = success && test "$GNU" = skipped ;;
            full) test "$RUST" = success && test "$GNU" = "$FULL_GNU" ;;
            *) exit 1 ;;
          esac
