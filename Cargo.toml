[package]
name = "taskq"
version = "4.6.44"
edition = "2024"
publish = false
# #1376: tests/*.rs are modules of tests/integration.rs
autotests = false

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", rev = "1c23357cb6a59a08acf9e6c438f7ab15bc7f3c34" }
tracing = "0.1"
ring = "0.17"
# telemetry upload blocks (docs/design/standalone-telemetry.md); both already in the tree via coreq
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
base64 = "0.22.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `taskq tray` (§ 4): macOS menu bar, Windows notification area
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26"
tao = "0.37"
wry = "0.57"
png = "0.18"
resvg = { version = "0.48.1", default-features = false }

# `taskq tray --snapshot` (§ 4): the webview's own capture API
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# tray notifications (§ 4, M14): already in the tree via objc2-app-kit
objc2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton", "NSFont", "NSFontDescriptor", "NSScreen", "NSMenu", "NSMenuItem", "NSEvent"] }
# shared icon renderer (§ 4): system-font digits through Core Text, already in the tree via tray-icon/wry
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString", "NSBundle"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(windows)'.dependencies]
# Unqualified Windows Summary uses Segoe outlines; macOS obtains SF outlines through Core Text.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
webview2-com = "0.39"
# `#[implement]` (the toast activator) names windows_core
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Notifications", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }

# #1377: faster test builds and runs; a debugger session needs `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
embed-resource = "3"
coreq-instrument = { git = "https://github.com/taskqorg/coreq", rev = "1c23357cb6a59a08acf9e6c438f7ab15bc7f3c34" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[[bin]]
name = "taskq"
path = "entry.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# #1376: tests/host_restart.rs's Windows powershell shim, prebuilt by `cargo test`
[[example]]
name = "native-inventory-windows"
path = "tests/fixtures/native-inventory-windows.rs"
