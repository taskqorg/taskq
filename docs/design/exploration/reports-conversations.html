<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Reports in Conversations · design checkpoint</title>
<link rel="stylesheet" href="../../../src/answer-card.css">
<link rel="stylesheet" href="../../../src/conversations.css">
<style>
:root{color-scheme:dark;--surface:light-dark(#fafbfc,#242c34);--muted:light-dark(#59636e,#b9c3cd);--edge:light-dark(#c2c9d1,#46505b);--hover:light-dark(#e9edf1,#37424c);--ask:light-dark(#955525,#edbc96)}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:light-dark(#243039,#eef2f5);font:16px/1.4 system-ui}button,input,select,textarea{font:inherit;color:inherit;background:transparent;border:1px solid var(--edge);border-radius:5px;padding:5px 8px;min-height:32px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ask);outline-offset:1px}a{color:inherit}p{margin:6px 0}h1,h2,h3{font-size:1em;margin:6px 0}small,.meta{color:var(--muted);font-size:.875em}.review{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-bottom:1px solid var(--edge)}.review label{display:flex;align-items:center;gap:4px}.review p{flex-basis:100%;margin:0}.workspace{height:760px;max-height:calc(100dvh - 130px);min-height:400px;display:flex;flex-direction:column;padding:8px;gap:8px}.chrome,.tools,.filters,.next{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.chrome{border-bottom:1px solid var(--edge);padding-bottom:6px;flex:none}.chrome h1{flex:1}.chrome .windows{display:flex;gap:4px;border-left:1px solid var(--edge);padding-left:6px}.conversation-grid{grid-template-columns:minmax(240px,29%) minmax(0,1fr);min-height:0}.conversation-list{overflow:hidden}.conversation-search input{width:100%}.filters button{font-size:.875em;padding:4px 6px}.filters button[aria-pressed=true]{border-color:var(--ask);background:var(--hover)}.conversation-rows{flex:1}.group-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:0;text-align:left;font-weight:600}.conversation-row[aria-current=page]{background:var(--hover);box-shadow:inset 3px 0 var(--ask)}.conversation-row small{display:flex;flex-wrap:wrap;gap:0 5px}.attention{color:var(--ask)}.row-actions{display:flex;gap:4px;float:right}.row-actions button{font-size:.8em;padding:0 4px;border:0}.row-actions:not(:focus-within){visibility:hidden}.conversation-item:hover .row-actions{visibility:visible}.conversation-detail{border:0}.thread-head{border-bottom:1px solid var(--edge);padding-bottom:6px}.thread-head h2{flex:1}.conversation-reader{padding:0 8px 8px 0;gap:8px}.conversation-reader>section{flex:none}.result-summary{white-space:normal}.qac-head{display:none}.qac{padding:8px 0}.reading-heading{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.reading-heading span{margin-left:auto}.proposal{border-left:2px solid var(--edge);padding-left:10px}.full-report{padding-block:4px}.full-report summary,.other summary{cursor:pointer;min-height:32px}.next{border-top:1px solid var(--edge);padding-top:6px}.status{border-top:1px solid var(--edge);font-size:.875em;color:var(--muted);margin-top:auto}.list-toggle{display:none}textarea{width:100%;min-height:70px;resize:vertical}.reason-form label{display:block}.reason-form button{margin-top:5px}.empty{padding:12px 0}.qac-choices{flex-direction:column;align-items:flex-start}.qac-choices button{width:auto;max-width:100%}.qac-detail{padding-left:30px}.qac-why{padding-left:0}.notice{color:var(--ask)}
@media(max-width:620px){.workspace{max-height:calc(100dvh - 210px)}.conversation-grid{grid-template-columns:minmax(0,1fr)}.list-toggle{display:inline-block}.workspace:not(.list-only) .conversation-list{display:none}.workspace.list-only .conversation-detail{display:none}.conversation-list{border:0;padding:0}.chrome .windows{display:none}.conversation-reader{padding-right:0}.review{font-size:14px}.row-actions{visibility:visible!important}}
.workspace .conversation-grid>.conversation-list{grid-column:1;grid-row:1}.workspace .conversation-grid>.conversation-detail{grid-column:2;grid-row:1}
@media(max-width:620px){.workspace .conversation-grid>.conversation-detail{grid-column:1;grid-row:1}}
</style>
<div class="review"><b>Design checkpoint · #1977</b><label>Screen <select id="scene"><option value="question">1 · Merged sidebar / question</option><option value="report">2 · Report and decision</option><option value="finished">3 · Finished task / correction</option><option value="empty">4 · Empty view</option><option value="many">5 · Many items</option><option value="unknown">6 · Unknown delivery</option></select></label><label>Theme <select id="theme"><option>dark</option><option>light</option></select></label><label>Text <select id="font"><option>16</option><option>20</option></select></label><p>Invented fixtures. Local simulation only: no board writes, native sessions, installation or acceptance claim.</p></div>
<div id="app" class="workspace"></div>
<script src="../../../build/web/answer-card.js"></script>
<script>
'use strict';
const app=document.querySelector('#app');
const seed=[
 {id:'pm',project:'taskq',title:'Release planning',kind:'chat',state:'Draft',pin:true,age:'12m'},
 {id:'q',project:'taskq',title:'#410 Keep the original request identity?',kind:'question',state:'Needs reply',age:'2m'},
 {id:'r',project:'taskq',title:'#411 Recovery options for interrupted requests',kind:'report',state:'Needs decision',unread:true,age:'8m'},
 {id:'t',project:'taskq',title:'#412 Recover an interrupted request once',kind:'task',state:'Unread result',unread:true,age:'10m'},
 {id:'d',project:'dashq',title:'#86 Keep project totals visible',kind:'question',state:'Needs reply',age:'18m'},
 {id:'a',project:'dashq',title:'#85 Clarify unavailable project totals',kind:'task',state:'Accepted',age:'1h'},
 {id:'o',project:null,title:'Compare runtime notes',kind:'chat',state:'Draft',age:'Time unknown'}
];
let rows,selected,filter,search,scene,correction,reasonAction,notice,next,dispatches,reasonDraft,collapsed;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(value){scene=value;rows=structuredClone(seed);filter='All';search='';selected=value==='report'||value==='unknown'?'r':value==='finished'?'t':'q';correction=value==='finished';reasonAction='';reasonDraft='';notice='';next=false;dispatches=[];collapsed=new Set();app.classList.remove('list-only');if(value==='finished'){rows.find(r=>r.id==='t').state='Accepted';rows.find(r=>r.id==='t').unread=false;}if(value==='empty'){rows=[];selected=null;}if(value==='many')for(let i=0;i<72;i++)rows.push({id:'dense-'+i,project:i%3?'taskq':'dashq',title:'#'+(500+i)+' '+(i===0?'Preserve the original request, full review evidence and decision history across interrupted updates':'Review collected result '+(i+1)),kind:'report',state:i%4?'Needs decision':'Accepted',age:'2h'});if(value==='unknown')notice='#411 · Make tasks · Delivery unknown. One held draft is confirmed; another receipt is missing. Check delivery before deciding.';draw();}
function matches(r){return (filter==='All'||filter==='Needs reply'&&r.state==='Needs reply'||filter==='Needs decision'&&['report','task'].includes(r.kind)&&['Needs decision','Later'].includes(r.state)||filter==='Finished'&&['report','task'].includes(r.kind))&&(!search||[r.title,r.project,r.state].join(' ').toLowerCase().includes(search.toLowerCase()));}
function groups(){const visible=rows.filter(matches);return [{name:'Pinned',rows:visible.filter(r=>r.pin)},...['taskq','dashq'].map(name=>({name,rows:visible.filter(r=>!r.pin&&r.project===name)})),{name:'Other',rows:visible.filter(r=>!r.pin&&!r.project)}].filter(g=>g.rows.length);}
function card(kind,choices,problem,done){const row=rows.find(r=>r.id===selected),n=row.id==='r'?411:row.id==='t'?412:410;return TaskqAnswerCard.render('https://example.invalid/invented/issues/'+kind,{n,url:'https://example.invalid/invented/issues/'+n,title:row.title,state:'ask',revision:1,question:{parsed:true,done,problem,choices:choices.map((c,i)=>({id:i+1,label:c[0],text:c[0],detail:c[1],recommended:!!c[2]})),evidence:[],limits:{}}},{bound:1,draft:'',...(scene==='unknown'?{op:{id:'invented-fixed-op',revision:1},about:'Make tasks',receipt:{state:'unknown',reason:'One held draft confirmed; another receipt missing'}}:{})},{answer:scene!=='unknown',composer:true}).replace('class="qac"','class="qac" data-kind="'+kind+'"');}
function pick(id){selected=id;correction=false;reasonAction='';reasonDraft='';notice='';next=false;app.classList.remove('list-only');draw();}
function choose(action){const row=rows.find(r=>r.id===selected);if(['Reopen','Follow up'].includes(action)||action==='Later'&&row.kind==='report'){reasonAction=action;if(action==='Later')reasonDraft=new Date(Date.now()+7*86400000).toISOString().slice(0,10);draw();return;}if(['Keep report','Cancel'].includes(action))return;if(scene==='unknown')return;dispatches.push({source:row.id,action});row.unread=false;row.state=action==='Later'?'Later':action==='Drop'?'Dropped':action==='Make tasks'?'Drafts created':'Accepted';notice='#'+(row.id==='r'?411:412)+' · '+action+' accepted (simulated readback).'+(action==='Make tasks'?' Held drafts #420 and #421; neither started.':'');next=true;draw();}
function content(r){
 if(r.kind==='question')return '<section><p class="meta">Worker asks you · 2m ago</p>'+card('answer',[['Reuse the identity','+ Avoid duplicate work; − keep immutable input.',true],['Start a new request','+ Independent attempt; − may repeat work.']],'How should an interrupted request resume?','The existing request is preserved.')+'</section><label>Your answer<textarea placeholder="Or type an answer"></textarea></label><button data-act="answer-send">Send</button>';
 if(r.kind==='chat')return '<p>Your existing planning draft stays here when a report opens.</p><label>Your message<textarea>Compare the recovery options before starting new work.</textarea></label><button disabled>Send · prototype</button>';
 const report=r.kind==='report';
 return '<section class="result-summary"><div class="reading-heading"><b>'+(report?'Report':'Finished task')+'</b><span class="meta">'+r.state+' · '+r.age+' ago</span></div>'+(report?'<h3>Question</h3><p>How should interrupted requests recover without duplicate work?</p><h3>Recommendation</h3><p>Reuse the original request identity. It preserves the first receipt and avoids repeating an uncertain write.</p>':'<h3>Changed</h3><p>Interrupted requests reuse their original identity.</p><h3>Checks</h3><p>Replay and lost-response checks passed. Merge-result CI green in this invented example.</p><h3>Open</h3><p>Native cross-host recovery is unverified.</p>')+'</section>'+
 (['Accepted','Dropped','Drafts created'].includes(r.state)?'<p class="meta">Decision recorded: '+r.state+'. The result stays in Finished.</p>':'<section>'+card('decision',[['Accept','+ Acknowledge this result; − closes this decision without new work.',true],['Later','+ Keep the decision open; − revisit it yourself.'],['Drop','+ Remove this decision from attention; − no follow-up work.']],'What should happen to this result?','Work is closed; reading does not accept it.')+'</section>')+
 '<details class="other" '+(correction||innerWidth<=620?'open':'')+'><summary>Other actions</summary>'+card('correction',[['Reopen','+ Request a correction; − creates a held successor.'],['Follow up','+ Add related work; − creates a separate held draft.',true]],'Does the original outcome need correction or additional work?','The original task stays closed.')+'</details>'+
 (reasonAction?'<form class="reason-form"><label>'+(reasonAction==='Later'?'Revisit on':esc(reasonAction)+' reason')+'<input id="reason" '+(reasonAction==='Later'?'type="date"':'maxlength="180" placeholder="What needs to change?"')+' required value="'+esc(reasonDraft)+'"></label><p class="meta">'+(reasonAction==='Later'?'The report returns to Decide on this date.':'Creates a linked held draft. Read it back, then Start separately.')+'</p><button type="submit" '+(!reasonDraft.trim()?'disabled':'')+'>Send</button> <button type="button" data-act="cancel-reason">Cancel</button></form>':'')+
 (report?'<section><h3>Proposed tasks · 2 held drafts</h3><div class="proposal"><details><summary>Document interrupted-request recovery</summary><p>Goal: make safe recovery steps visible.</p><p>Acceptance: help names the original request identity.</p></details><details><summary>Show the first receipt after reconnect</summary><p>Goal: explain the prior request outcome.</p><p>Acceptance: reconnect shows the source receipt.</p></details>'+card('make',[['Make tasks','+ Create these two held drafts; − read them back before separate Start.',true],['Keep report','+ Create nothing; − follow-up stays unfiled.']],'Create these held drafts?','The exact proposed work is listed above.')+'</div></section><details class="full-report"><summary>Full report and evidence</summary><h3>Findings</h3><p>An immutable identity reconciles lost responses without duplicate work.</p><h3>Options</h3><p>Reuse the identity: protects retries; requires immutable input. New request: simpler; risks duplicate work.</p><a href="https://example.invalid/invented-evidence">Invented evidence link</a></details>':'<details class="full-report"><summary>Brief, question history and review</summary><p>Original goal: recover one interrupted request without repeated work.</p><p>Question: keep the original request? Answer: reuse the identity.</p><p>Reviewer: source protections retained; native evidence remains open.</p></details>');
}
function draw(){
 const gs=groups(),r=rows.find(r=>r.id===selected),empty=!gs.length;
 app.innerHTML='<header class="chrome"><h1>Conversations</h1><button class="list-toggle" data-act="list">'+(app.classList.contains('list-only')?'Back':'List')+'</button><button disabled>New</button><button disabled>History</button><button disabled>Work sessions</button><span class="windows"><button disabled>Pin</button><button disabled>Enlarge</button><button disabled>Close</button></span></header><div class="conversation-grid"><aside class="conversation-list" aria-label="Conversations sidebar"><div class="filters" aria-label="Filter">'+['All','Needs reply','Needs decision','Finished'].map(f=>'<button data-filter="'+f+'" aria-pressed="'+(filter===f)+'">'+f+'</button>').join('')+'</div><label class="conversation-search"><span class="sr-only">Search conversations</span><input id="search" placeholder="Search conversations" value="'+esc(search)+'"></label><div class="tools"><b>Recent</b><button disabled>Archive</button></div><div class="conversation-rows">'+(empty?'<p class="empty">'+(search?'No matches. Clear search to see this view.':filter==='All'?'No conversations yet. New opens a draft.':'No '+filter.toLowerCase()+' items in this view.')+'</p>':'')+gs.map(g=>'<section data-group="'+g.name+'"><button class="group-head" data-collapse="'+g.name+'" aria-expanded="'+(!collapsed.has(g.name)||!!search)+'"><span>'+g.name+'</span><small>'+g.rows.length+(scene==='many'?' loaded':'')+'</small></button>'+((collapsed.has(g.name)&&!search)?'':g.rows.map(row=>'<div class="conversation-item"><button class="conversation-row" data-thread="'+row.id+'" '+(row.id===selected?'aria-current="page"':'')+'><span>'+esc(row.title)+'</span><small><span class="'+(['Needs reply','Needs decision','Later'].includes(row.state)?'attention':'')+'">'+row.state+'</span><span>· '+row.age+'</span>'+(row.unread?'<b>· Unread</b>':'')+'</small></button><span class="row-actions"><button disabled aria-label="Pin '+esc(row.title)+'">Pin</button><button disabled aria-label="Archive '+esc(row.title)+'">Archive</button></span></div>').join(''))+'</section>').join('')+(scene==='many'?'<button disabled>More finished work · 72 loaded</button>':'')+'</div></aside><main class="conversation-detail"><div class="thread-head tools"><h2>'+esc(r?r.title:'Conversations')+'</h2>'+(r?'<span class="meta">'+(r.project||'No project')+'</span><button disabled>Details</button>':'')+'</div><div class="conversation-reader">'+(r?content(r):'<section class="empty"><h2>One place for questions and finished work</h2><p>New opens a conversation. Reports and closed tasks appear here after collection.</p><button disabled>New conversation</button></section>')+(notice?'<p class="notice" role="status">'+esc(notice)+'</p>':'')+(scene==='unknown'?'<div class="next"><button data-act="reconcile">1. Check delivery ★</button><button data-act="stay">2. Stay here</button></div>':next?'<div class="next">'+(notice.includes('draft')?'<button data-act="read-draft">1. Read held draft ★</button><button data-act="next">2. Next unresolved item</button><button data-act="stay">3. Stay here</button>':'<button data-act="next">1. Next unresolved item ★</button><button data-act="stay">2. Stay here</button>')+'</div>':'')+'</div></main></div><footer class="status">'+(scene==='many'?'Collection incomplete · counts show loaded rows; board total unknown.':scene==='unknown'?'Cached report available · decision delivery unknown.':'Design fixture · local interactions only · no live state changed.')+'</footer>';
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.thread){pick(b.dataset.thread);return;}if(b.dataset.filter){filter=b.dataset.filter;draw();return;}if(b.dataset.collapse){const key=b.dataset.collapse;collapsed.has(key)?collapsed.delete(key):collapsed.add(key);draw();return;}if(b.dataset.qac==='choose'){const kind=b.closest('[data-kind]').dataset.kind,id=Number(b.dataset.choice),actions={answer:['Reuse the identity','Start a new request'],decision:['Accept','Later','Drop'],correction:['Reopen','Follow up'],make:['Make tasks','Keep report']};choose(actions[kind][id-1]);return;}if(b.dataset.act==='list'){app.classList.toggle('list-only');draw();}if(b.dataset.act==='cancel-reason'){reasonAction='';draw();}if(b.dataset.act==='next'){const ordered=groups().flatMap(g=>g.rows),at=ordered.findIndex(r=>r.id===selected),rotated=[...ordered.slice(at+1),...ordered.slice(0,at)],target=rotated.find(r=>['Needs reply','Needs decision','Later'].includes(r.state));if(target)pick(target.id);else{notice='No unresolved items in this view. Choose All to continue.';draw();}}if(b.dataset.act==='read-draft'){notice='Held draft #420 · readback preview. No task started.';draw();}if(b.dataset.act==='reconcile'){notice='Same-operation readback only (simulated). Delivery remains unknown; nothing redispatched.';draw();}});
app.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;draw();const n=document.querySelector('#search');n.focus();n.setSelectionRange(pos,pos);}if(e.target.id==='reason'){reasonDraft=e.target.value;e.target.form.querySelector('[type=submit]').disabled=!reasonDraft.trim();}});
app.addEventListener('submit',e=>{e.preventDefault();if(!reasonDraft.trim())return;if(reasonAction==='Later'){if(!(new Date(reasonDraft+'T12:00:00Z')>Date.now()))return;dispatches.push({source:selected,action:'Later',until:reasonDraft+'T12:00:00Z'});rows.find(r=>r.id===selected).state='Later';notice='Later: back in Decide on '+reasonDraft+'.';}else{dispatches.push({source:selected,action:reasonAction,reason:reasonDraft});notice=reasonAction+' · Created linked held draft #420 (simulated readback). Original stays closed.';}reasonAction='';reasonDraft='';next=true;draw();});
document.querySelector('#scene').onchange=e=>reset(e.target.value);
document.querySelector('#theme').onchange=e=>document.documentElement.style.colorScheme=e.target.value;
document.querySelector('#font').onchange=e=>document.body.style.fontSize=e.target.value+'px';
window.review={reset,state:()=>({selected,filter,search,dispatches,groups:groups().map(g=>({name:g.name,ids:g.rows.map(r=>r.id)}))})};
reset('question');
</script></html>
