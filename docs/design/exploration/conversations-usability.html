function deliveryHTML(t,m){if(!m.op)return '';const labels={sending:'Sending…',accepted:'Accepted by the session',working:'Delivered',unknown:'Delivery unknown · your message may have arrived',failed:'Not sent · the session refused this turn',done:'Delivered',answered:'Answer accepted · the task can continue'};return `<div class="delivery ${m.delivery==='unknown'?'ask':m.delivery==='failed'?'error':m.delivery==='answered'?'work':'muted'}" data-operation="${m.op}">${m.delivery==='sending'?'<span class="spinner" aria-hidden="true"></span>':ic(m.delivery==='unknown'?'circle-help':m.delivery==='failed'?'circle-x':'check')}<span>${labels[m.delivery]||'State unknown'}</span>${m.delivery==='unknown'?'<button data-act="reconcile">Check delivery</button>':''}${m.delivery==='failed'&&t.state==='failed'&&t.operation?.id===m.op?'<button data-act="retry">Try again</button>':''}</div>`;}

function renderFeed(restore=false){const t=current(),reading=$('#reading'),content=$('#history-content');if(historyView){historyView.destroy();historyView=null;}if(!t){content.innerHTML='<div class="empty-state"><h2>A clear place to work with your agent</h2><p>Keep questions, replies and the next draft together.</p><button data-act="new">'+ic('plus')+'New conversation</button></div>';return;}if(t.kind==='history'){content.innerHTML='<div id="virtual-before"></div><div id="virtual-rows"></div><div id="virtual-after"></div>';historyView=virtualHistory(t,reading);historyView.restore(t.anchor);return;}const warning=t.historyUnavailable?'<div class="read-warning" role="status"><p class="ask">History unavailable. Previously read messages are shown.</p><button data-act="retry-history">Retry reading</button></div>':'';const activity=t.activity.length?`<details class="activity"><summary>${ic('terminal')} ${t.activity.length} activity ${t.activity.length===1?'update':'updates'} · latest: ${esc(t.activity.at(-1))}</summary>${t.activity.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`:'';content.innerHTML=warning+(t.kind==='question'?renderQuestion(t):t.kind==='task'?'<div class="empty-state"><h2>No open question</h2><p>This task thread has no answer to send. Its board and recorded native session remain separate destinations.</p><button data-act="task-details">View task details</button></div>':t.messages.length?t.messages.map(m=>messageHTML(t,m)).join(''):'<div class="empty-state"><h2>Start with what you want to achieve</h2><p>Your message goes to the project and runtime selected below.</p></div>')+activity;if(restore)reading.scrollTop=t.scroll??(t.kind==='question'||t.kind==='task'?0:reading.scrollHeight);icons();}
function renderComposer(){const t=current();if(!t){$('#composer').innerHTML='';return;}if(t.archived){$('#composer').innerHTML='<div class="composer-context">Archived in TaskQ. The native session is unchanged.</div><button data-act="restore">'+ic('archive-restore')+'Restore to reply</button>';icons();return;}if(t.kind==='task'){$('#composer').innerHTML='<div class="composer-context">No open question · no message is sent from this task view.</div>';return;}const question=t.kind==='question';const blocked=busy(t)||unknown(t)||t.stale||t.state==='busy'||question&&t.answered;let reason=t.stale?'The question changed. Your draft is kept.':unknown(t)?'Check the original delivery before sending again.':busy(t)?t.state==='working'?'Agent is working. Your next draft is kept.':'Waiting for delivery confirmation.':t.state==='busy'?'This session is open in the native app. Close it there first.':question&&t.answered?'This question has been answered. Waiting for a new question.':t.notice;$('#composer').innerHTML=`${t.fresh?`<div class="new-context"><label>Project <select id="new-project"><option>taskq</option><option>csgo</option><option>dashq</option></select></label><label>Runtime <select id="new-runtime"><option value="codex" ${t.provider==='codex'?'selected':''}>Codex</option><option value="claude" ${t.provider==='claude'?'selected':''}>Claude Code</option></select></label></div>`:''}<div class="composer-context"><span>${question?'Answer #380':t.fresh?'New conversation':'Message to '+provider(t).label}</span><span>${question?'Text only':'Same native session'}</span></div><div class="composer-box"><div class="file-chips">${t.files.map((f,i)=>`<span class="file-chip">${ic('paperclip')}${esc(f.name)}<button data-remove-file="${i}" aria-label="Remove ${esc(f.name)}">${ic('x')}</button></span>`).join('')}</div><textarea id="draft" rows="2" aria-label="${question?'Your answer':'Message'}" placeholder="${question?'Write your answer…':'Ask, clarify, or give the next instruction…'}" ${question&&t.answered?'disabled':''}>${esc(t.draft)}</textarea><div class="composer-tools">${!question?'<button data-act="attach" aria-label="Attach files">'+ic('paperclip')+'</button><input id="file-input" type="file" multiple accept=".txt,.md,.png,.jpg,.jpeg,.webp" hidden>':''}<span>${question?'': 'Shift+Enter for a new line'}</span><button class="send" data-act="send" ${blocked||!t.draft.trim()?'disabled':''}>${question?'Send answer':'Send'}${ic('arrow-up')}</button></div></div>${reason?`<div class="composer-reason ${t.stale||unknown(t)?'ask':''}" role="status">${esc(reason)}${t.stale?'<button data-act="review-question">Review updated question</button>':''}${t.state==='busy'?'<button data-act="release-writer">Check session</button>':''}</div>`:''}`;icons();}
function renderWorkspace(restore=true){const scrollNode=$('#reading');if(scrollNode.dataset.thread!==String(selected||'')){historyView?.destroy();historyView=null;const fresh=scrollNode.cloneNode(false);fresh.dataset.thread=String(selected||'');fresh.innerHTML='<div id="history-content"></div>';scrollNode.replaceWith(fresh);}const field=$('#draft'),focus=field===document.activeElement,caret=field?[field.selectionStart,field.selectionEnd]:null;renderHeading();renderFeed(restore);renderComposer();if(focus&&$('#draft')&&!$('#draft').disabled){$('#draft').focus({preventScroll:true});$('#draft').setSelectionRange(...caret);}updateJump();metrics();}

function atBottom(){const e=$('#reading');return e.scrollHeight-e.clientHeight-e.scrollTop<36;}
function latest(){const e=$('#reading');if(historyView)historyView.followEnd();else e.scrollTop=e.scrollHeight;const t=current();if(t)t.newOutput=0;updateJump();}

function refreshThread(t,follow){if(t.id===selected){const scroll=$('#reading').scrollTop;renderWorkspace(false);if(follow){if(historyView)historyView.followEnd();else $('#reading').scrollTop=$('#reading').scrollHeight;}else if(t.kind!=='history')$('#reading').scrollTop=scroll;if(!follow)t.newOutput=(t.newOutput||0)+1;updateJump();}renderThreads();metrics();}
function queueEvent(t,delay,callback){const operation=t.operation?.id;const prior=timers.get(t.id);if(prior)clearTimeout(prior);timers.set(t.id,setTimeout(()=>{timers.delete(t.id);if(t.operation?.id===operation)callback();},delay));}

function begin(t,text,choice=null){if(busy(t)||unknown(t)||t.stale||t.state==='busy'||t.archived||t.kind==='question'&&t.answered||!text.trim())return false;const op='demo-'+nextId++;const msg={id:'user-'+op,role:'user',text,time:stamp(),op,delivery:'sending'};t.messages.push(msg);t.operation={id:op,text,choice,revision:t.revision,state:'sending',behavior:scenario,files:t.files.map(f=>({...f}))};t.state='sending';t.sessionActivity='idle';t.startedAt=Date.now();t.draft='';t.files=[];t.notice='';dispatched.push({thread:t.id,id:op,provider:t.provider,choice,revision:t.revision});events.push({thread:t.id,type:'sending',op});refreshThread(t,true);queueEvent(t,550,()=>advance(t));return true;}
function advance(t=current()){if(!t||!t.operation)return;const m=t.messages.find(m=>m.op===t.operation.id);if(!m)return;const follow=t.id===selected?atBottom():false;const timer=timers.get(t.id);if(timer){clearTimeout(timer);timers.delete(t.id);}if(t.state==='sending'){
 if(t.operation.behavior==='unknown'){t.state='unknown';m.delivery='unknown';t.operation.state='unknown';refreshThread(t,follow);return;}
 if(t.operation.behavior==='failed'){t.state='failed';m.delivery='failed';t.operation.state='failed';t.draft=t.operation.text;refreshThread(t,follow);return;}
 if(t.kind==='question'){t.state='idle';t.answered=true;m.delivery='answered';t.operation.state='answered';t.unread=false;refreshThread(t,follow);renderTasks();return;}
 t.state='accepted';m.delivery='accepted';t.operation.state='accepted';t.fresh=false;refreshThread(t,follow);queueEvent(t,550,()=>advance(t));return;
 }if(t.state==='accepted'){const normalized=provider(t).decode(provider(t).script('')[1]);applyNormalized(t,normalized);m.delivery='accepted';t.operation.state='accepted';refreshThread(t,follow);queueEvent(t,900,()=>advance(t));return;}
 if(t.state==='working'){if(!t.activity.length){const raw=provider(t).script('')[2];applyNormalized(t,provider(t).decode(raw));refreshThread(t,follow);if(t.operation.behavior!=='slow')queueEvent(t,1800,()=>advance(t));return;}if(t.operation.behavior==='turn-failed'){applyNormalized(t,{type:'failed',text:'This turn ended before a reply was recorded. Your message was accepted. Review the session state before continuing.'});refreshThread(t,follow);return;}const raw=provider(t).script(replyText(t))[3];applyNormalized(t,provider(t).decode(raw));m.delivery='done';t.operation.state='recorded';refreshThread(t,follow);}
}
function applyNormalized(t,event){events.push({thread:t.id,type:event.type,op:t.operation?.id});if(event.type==='working'){t.state='working';t.sessionActivity='working';t.startedAt=Date.now();}if(event.type==='activity'){t.activity.push(event.text);const submitted=t.messages.find(m=>m.op===t.operation?.id);if(submitted&&t.kind==='history')submitted.tools=t.activity.slice();}if(event.type==='failed'){t.state='error';t.sessionActivity='idle';t.messages.push({id:'failure-'+t.operation.id,role:'assistant',kind:'failure',text:event.text,time:stamp()});t.activity=[];}if(event.type==='reply'){const submitted=t.messages.find(m=>m.op===t.operation.id);if(submitted)submitted.tools=t.activity.slice();t.messages.push({id:'assistant-'+t.operation.id,role:'assistant',text:event.text,time:stamp()});t.state='idle';t.sessionActivity='idle';t.activity=[];}}
function reconcile(){const t=current();if(!unknown(t)||!t.operation)return;const m=t.messages.find(m=>m.op===t.operation.id);t.state='accepted';t.operation.state='accepted';m.delivery='accepted';events.push({thread:t.id,type:'reconciled',op:t.operation.id});refreshThread(t,atBottom());if(t.kind==='question'){t.state='idle';t.answered=true;m.delivery='answered';t.operation.state='answered';refreshThread(t,atBottom());}else queueEvent(t,600,()=>advance(t));}
function newThread(){remember();const t=baseThread('new-'+nextId++,'New conversation',runtime,{fresh:true});threads.unshift(t);list='recent';search='';$('#thread-search').value='';select(t.id);renderThreads();$('#draft')?.focus({preventScroll:true});}
function scenarioSelect(name){remember();scenario=name;$('#demo-scenario').value=name;$('.conversation-window').hidden=false;empty=false;list='recent';if(name==='question'||name==='stale'){const t=threads.find(t=>t.id==='question');Object.assign(t,{messages:[],answered:false,state:'idle',sessionActivity:'idle',notice:'',operation:null,stale:name==='stale',scroll:0,revision:name==='stale'?5:4,draft:name==='stale'?'Use the existing tour; keep S4 approval separate.':'',unread:true});select(t.id);}
 else if(name==='history'){const t=threads.find(t=>t.id==='history');t.provider=runtime;select(t.id);}
 else if(name==='archive'){list='archive';select('archived');}
 else if(name==='empty'){selected=null;empty=true;renderWorkspace();renderThreads();}
 else {const t=threads.find(t=>t.id==='pm-'+runtime);const timer=timers.get(t.id);clearTimeout(timer);timers.delete(t.id);Object.assign(t,{messages:initialMessages(),state:name==='busy'?'busy':'idle',operation:null,notice:'',activity:[],historyUnavailable:name==='unavailable',draft:name==='busy'?'Please review the next two held tasks.':'',newOutput:0,scroll:null,archived:false});select(t.id);if(['slow','unknown','failed','turn-failed'].includes(name))begin(t,name==='slow'?'Read the open review items and propose the next steps.':'Can you confirm the next release checks?');}
 renderTasks();renderThreads();metrics();}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;icons();$('#prototype-dialog').showModal();}
function closeModal(){$('#prototype-dialog').close();}
function metrics(){const t=current();$('[data-act=finish]').disabled=!t||!(t.kind==='history'||busy(t));$('#demo-metrics').textContent=`Selected thread: ${t?.id||'none'}\nRuntime: ${t?provider(t).label:'none'}\nDispatches: ${dispatched.length} · reconciliation never adds a dispatch\nMounted message rows: ${$$('.message').length}${historyView?' / 10,000 source records':''}\nCurrent delivery: ${t?.operation?.state||'none'}\nAll behavior is local fixture simulation.`;$('#demo-observation').textContent=scenario==='history'?'Scroll anywhere; the input stays in place.':scenario==='slow'?'Confirmed working; Next event completes the simulated response.':scenario==='unknown'?'Check delivery reconciles the same operation.':'';}
function historyMessage(t,i){const topics=['Keep the question close to its source task. Preserve its original choice numbers and revision.','The menu should tell me what needs attention. I want to open the question and get back to the same task list.','A transport receipt is different from a reply. Show accepted input once, then let the actual agent response arrive below it.','I am reading older context. New output must not move the message I am looking at.','Keep the next draft editable while the current turn is working. Do not queue it without an explicit Send.','Unknown delivery needs a check against the original operation. A timeout is not permission to send it again.','The same conversation layout works for both runtimes. Capabilities and native event shapes stay inside their adapters.','Use real wheel and keyboard input in the acceptance journey. A screenshot cannot establish continuity.'];const role=i%3===0?'user':'assistant',extra=i%11===0?'\n\nThe long-content case includes a second paragraph. It wraps at the available width without a horizontal scrollbar, and it changes height when the font or pane width changes.':i%7===0?'\n\nNext: 1. Review the interaction. 2. Repeat it with delayed delivery.':'';return {id:'history-record-'+i,role,text:topics[i%topics.length]+extra,time:'Earlier · '+(i+1)};}
// shortcut: this known-count fixture supplies geometry; production must use measured native cursor pages.
function virtualHistory(t,reading){const baseCount=t.historyCount||10000,count=baseCount+t.messages.length,content=$('#history-content'),rows=$('#virtual-rows'),before=$('#virtual-before'),after=$('#virtual-after');let heights=new Float64Array(count).fill(150),offsets=new Float64Array(count+1),first=-1,last=-1,raf=0,dead=false,measuring=false,loadedPages=new Set(),width=reading.clientWidth,pinEnd=false;
 const rebuild=()=>{for(let i=0;i<count;i++)offsets[i+1]=offsets[i]+heights[i];};rebuild();before.style.height=offsets[count]+'px';
 function indexAt(y){let lo=0,hi=count;while(lo<hi){const mid=(lo+hi)>>1;if(offsets[mid+1]<=y)lo=mid+1;else hi=mid;}return Math.min(count-1,lo);}
 function anchor(){const i=indexAt(reading.scrollTop);return {index:i,offset:reading.scrollTop-offsets[i]};}
 function restore(a){pinEnd=!a;const value=a?offsets[Math.max(0,Math.min(count-1,a.index))]+a.offset:offsets[count];reading.scrollTop=value;draw();}
 function draw(){raf=0;if(dead)return;const selection=window.getSelection();if(selection&&!selection.isCollapsed&&rows.contains(selection.anchorNode))return;const a=anchor(),bottomPinned=pinEnd;let from=Math.max(0,a.index-5),to=Math.min(count,indexAt(reading.scrollTop+reading.clientHeight)+7);if(from===first&&to===last)return;first=from;last=to;const page=Math.floor(from/40);if(!loadedPages.has(page)){loadedPages.add(page);if(loadedPages.size>5)loadedPages.delete(loadedPages.values().next().value);$('#history-loading').hidden=false;clearTimeout(loadTimer);loadTimer=setTimeout(()=>{$('#history-loading').hidden=true;},140);}before.style.height=offsets[from]+'px';after.style.height=(offsets[count]-offsets[to])+'px';rows.innerHTML=Array.from({length:to-from},(_,j)=>messageHTML(t,from+j<baseCount?historyMessage(t,from+j):t.messages[from+j-baseCount])).join('');let changed=false;[...rows.children].forEach((node,j)=>{const h=node.getBoundingClientRect().height,i=from+j;if(Math.abs(heights[i]-h)>.25){heights[i]=h;changed=true;}});if(changed){rebuild();before.style.height=offsets[from]+'px';after.style.height=(offsets[count]-offsets[to])+'px';reading.scrollTop=bottomPinned?reading.scrollHeight:offsets[a.index]+a.offset;}t.anchor=anchor();metrics();}
 function schedule(){if(!raf&&!dead)raf=requestAnimationFrame(draw);}
 function wheel(e){if(e.deltaY<0)pinEnd=false;}function pointer(){pinEnd=false;}function key(e){if(e.key==='End'){e.preventDefault();pinEnd=true;reading.scrollTop=reading.scrollHeight;schedule();}else if(e.key==='Home'){e.preventDefault();pinEnd=false;reading.scrollTop=0;schedule();}else if(['PageUp','ArrowUp'].includes(e.key))pinEnd=false;}
 const resize=new ResizeObserver(()=>{if(dead||Math.abs(reading.clientWidth-width)<1)return;const a=anchor();width=reading.clientWidth;heights.fill(150);rebuild();first=-1;reading.scrollTop=offsets[a.index]+a.offset;schedule();});resize.observe(reading);reading.addEventListener('scroll',schedule,{passive:true});reading.addEventListener('wheel',wheel,{passive:true});reading.addEventListener('pointerdown',pointer);reading.addEventListener('keydown',key);
 return {anchor,restore,followEnd(){pinEnd=true;reading.scrollTop=reading.scrollHeight;schedule();},destroy(){dead=true;resize.disconnect();reading.removeEventListener('scroll',schedule);reading.removeEventListener('wheel',wheel);reading.removeEventListener('pointerdown',pointer);reading.removeEventListener('keydown',key);cancelAnimationFrame(raf);},append(){}};
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const t=current();if(b.dataset.thread){select(b.dataset.thread);return;}if(b.dataset.task){expanded=expanded===Number(b.dataset.task)?null:Number(b.dataset.task);const scroll=$('.menu-scroll').scrollTop;renderTasks();$('.menu-scroll').scrollTop=scroll;return;}if(b.dataset.filter){filter=b.dataset.filter;renderTasks();return;}if(b.dataset.list){remember();list=b.dataset.list;const prior=threads.find(t=>t.id===selectedByList[list]&&t.archived===(list==='archive'));selected=prior?.id||null;renderThreads();renderWorkspace(true);return;}if(b.dataset.choice){const c=choices.find(c=>c.id===Number(b.dataset.choice));begin(t,c.text+'. '+c.more,c.id);return;}if(b.dataset.removeFile){t.files.splice(Number(b.dataset.removeFile),1);renderComposer();return;}if(b.dataset.openTask){const task=TASKS.find(t=>t.n===Number(b.dataset.openTask));let thread=threads.find(t=>t.id==='task-'+task.n);if(!thread){thread=baseThread('task-'+task.n,'#'+task.n+' · '+task.title,runtime,{kind:'task',project:task.p});threads.push(thread);}list='recent';select(thread.id);$('.conversation-window').hidden=false;return;}if(b.dataset.pinTask){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));return;}
 switch(b.dataset.act){
 case 'open-question':list='recent';select('question');$('.conversation-window').hidden=false;break;
 case 'conversations':case 'show-workspace':$('.conversation-window').hidden=false;if(!current())select('question');break;
 case 'hide-workspace':remember();$('.conversation-window').hidden=true;break;
 case 'hide-menu':$('.task-window').hidden=true;$('.stage').classList.add('enlarged');break;
 case 'show-menu':$('.task-window').hidden=false;$('.stage').classList.remove('enlarged');break;
 case 'keep-menu':case 'topmost':b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));break;
 case 'enlarge':$('.stage').classList.toggle('enlarged');$('.task-window').hidden=false;break;
 case 'toggle-list':$('.conversation-window').classList.toggle(matchMedia('(max-width:560px)').matches?'list-open':'list-collapsed');break;
 case 'filter-menu':$('.menu-search').hidden=!$('.menu-search').hidden;if(!$('.menu-search').hidden)$('#task-search').focus();break;
 case 'send':begin(t,t.draft);break;
 case 'finish':if(t?.kind==='history'){const bottom=atBottom();const anchor=historyView?.anchor();t.messages.push({id:'fixture-update-'+nextId++,role:'assistant',text:'A new update arrived while you were reading earlier context.',time:stamp()});renderFeed();historyView.restore(bottom?null:anchor);if(!bottom)t.newOutput=(t.newOutput||0)+1;updateJump();metrics();}else advance();break;
 case 'latest':latest();break;
 case 'new':newThread();break;
 case 'reset':init();break;
 case 'reconcile':reconcile();break;
 case 'retry':if(t?.state==='failed'){scenario='chat';$('#demo-scenario').value='chat';const text=t.operation.text;t.state='idle';begin(t,text);}break;
 case 'review-question':t.stale=false;t.notice='Updated question reviewed. Nothing sent.';renderWorkspace(false);break;
 case 'release-writer':t.state='idle';t.notice='No active native writer in this sample. Your draft is kept.';renderWorkspace(false);break;
 case 'retry-history':t.historyUnavailable=false;renderWorkspace(false);break;
 case 'restore':t.archived=false;list='recent';selectedByList.recent=t.id;renderAll();break;
 case 'undo':if(undo){const restored=threads.find(t=>t.id===undo);restored.archived=false;list='recent';selected=undo;selectedByList.recent=undo;undo=null;renderAll();}break;
 case 'attach':$('#file-input')?.click();break;
 case 'appearance':modal('Appearance',`<label>Text size <select id="appearance-size">${[14,16,18,20].map(n=>`<option value="${n}" ${parseInt(root.style.getPropertyValue('--tq-size')||'16')===n?'selected':''}>${n} px</option>`).join('')}</select></label><label>Theme <select id="appearance-theme"><option value="light dark">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>`);break;
 case 'thread-menu':if(t)modal('Conversation actions',`<div class="dialog-options">${t.unread?'<button data-act="mark-read">'+ic('check')+'Mark read</button>':''}<button data-act="archive-thread">${ic(t.archived?'archive-restore':'archive')}${t.archived?'Restore':'Archive conversation'}</button><button data-act="details">${ic('info')}Details and session</button>${!t.kind||t.kind==='history'?'<button data-act="watch">'+ic('clock')+'Watch and activity</button>':''}<button data-act="from-draft">${ic('plus')}New from draft</button></div>`);break;
 case 'mark-read':t.unread=false;closeModal();renderThreads();break;
 case 'archive-thread':if(t){remember();t.archived=!t.archived;closeModal();if(t.archived){undo=t.id;selected=threads.find(c=>!c.archived&&c.id!==t.id)?.id||null;selectedByList.recent=selected;}else{list='recent';selectedByList.recent=t.id;}renderAll();}break;
 case 'details':modal('Session details',`<p>${esc(t.title)}</p><p>Runtime: ${provider(t).label}<br>Project: ${esc(t.project)}<br>Session: <code>sample-${esc(t.id)}</code></p><p class="muted">Local fixture. Opening or reading never sends a message or acknowledges an event.</p>${t.operation?'<p>Operation: <code>'+esc(t.operation.id)+'</code><br>Delivery: '+esc(t.operation.state)+'</p>':''}`);break;
 case 'task-details':modal('Task details','<p>State is read from the task snapshot. This local prototype changes no board task and opens no worker session.</p>');break;
 case 'watch':modal('Watch and activity','<p>No watch is active in this sample.</p><p class="muted">Scheduled turns require a separately configured watch. The prototype does not schedule work or change runtime policy.</p>');break;
 case 'from-draft':{const draft=t.draft,files=t.files;closeModal();newThread();current().draft=draft;current().files=files.map(f=>({...f}));t.draft='';t.files=[];renderComposer();break;}
 case 'close-dialog':closeModal();break;
 }
 icons();metrics();
});
root.addEventListener('input',e=>{const t=current();if(e.target.id==='draft'&&t){t.draft=e.target.value;const el=e.target;el.style.height='50px';el.style.height=Math.min(130,el.scrollHeight)+'px';updateSend();}if(e.target.id==='thread-search'){search=e.target.value;renderThreads();}if(e.target.id==='task-search'){taskSearch=e.target.value.toLowerCase();renderTasks();}});

let elapsedTimer=setInterval(()=>{const t=current(),el=$('#elapsed');if(t?.state==='working'&&el)el.textContent='· '+Math.max(1,Math.floor((Date.now()-t.startedAt)/1000))+'s';},1000);

root.prototype={scenario:scenarioSelect,metrics:()=>({dispatches:dispatched.map(x=>({...x})),events:events.map(x=>({...x})),selected,list,threads:threads.map(t=>({id:t.id,state:t.state,sessionActivity:t.sessionActivity,draft:t.draft,archived:t.archived,operation:t.operation,revision:t.revision,anchor:t.anchor})),mounted:$$('.message').length,anchor:historyView?.anchor()}),append:()=>{const t=current();if(t){const follow=atBottom();t.messages.push({id:'fixture-append-'+nextId++,role:'assistant',text:'A new update arrived while you were reading earlier context.',time:stamp()});refreshThread(t,follow);}},advance:()=>advance(),dispose:()=>{clearInterval(elapsedTimer);for(const timer of timers.values())clearTimeout(timer);historyView?.destroy();}};
