function facets(){const c=working(),total=tasks.filter(t=>matches(t,c,true));return `<div class="rq-states" aria-label="Task state filters"><button data-action="all-states" aria-pressed="${!c.states.length}">All ${total.length}</button>${states.map(s=>({s,n:total.filter(t=>t.s===s).length})).filter(o=>o.n||c.states.includes(o.s)).map(({s,n})=>`<button class="rq-statecap ${tint(s)}" data-state="${s}" aria-pressed="${c.states.includes(s)}" aria-label="${names[s]} ${n}" data-tooltip="${names[s]} · ${n}">${I(glyph[s])}${n}</button>`).join('')}</div>`;}
function task(t,c){return `<article class="rq-task"><div class="rq-taskmeta"><button class="rq-reference cursor-interaction" data-task="${t.id}" aria-label="Details ${t.p} #${t.id}" aria-haspopup="dialog" aria-current="${c.selection===t.id?'true':'false'}">${brand('github')}${c.group?'':esc(t.p)+' '}#${t.id}</button><span class="rq-timing ${tint(t.s)}"><button data-session="${t.id}" aria-label="${t.rt==='openai'?'Codex':'Claude'} · ${t.host==='mac'?'Open session':'Session unavailable'}" ${t.host!=='mac'?'disabled data-tooltip="No verified session target on this device"':''}>${brand(t.rt)}${t.host==='win'?I('network'):''}</button><span data-tooltip="${names[t.s]} · current stage ${time(t.age)}" aria-label="${names[t.s]} · ${time(t.age)}">${I(glyph[t.s])} ${time(t.age)}</span></span></div><button class="rq-title" data-issue="${t.id}">${esc(t.title)}</button></article>`;}
const canDeleteView=v=>!!v&&!initialViews.some(b=>b.id===v.id);
const viewContext=()=>JSON.stringify([model.view,working().states,working().projects,working().query,working().group]);
function deletionReceipt(){return model.deletedView?`<div class="rq-row rq-small rq-view-undo" role="status"><span>Deleted “${esc(model.deletedView.view.name)}”</span><button data-action="undo-delete-view">${I('undo-2')}Undo</button></div>`:'';}
function tasksBody(){const c=working(),v=view(),ordered=sorted(c),list=c.group?['TaskQ','AgentQ','PilotQ'].flatMap(p=>ordered.filter(t=>t.p===p)):ordered;return `<div class="rq-discovery">${facets()}<div class="rq-viewbar"><button class="rq-current" data-pop="views">${I('bookmark')}<span>${esc(v.name)}${isDirty()?' *':''}</span></button>${isDirty()?ib('undo-2','Reset to saved view','reset-view'):''}${model.views.filter(x=>x.star&&x.id!==v.id).map(x=>`<button data-view="${x.id}"><span>${esc(x.name)}</span></button>`).join('')}<span class="rq-space"></span>${ib('sliders-horizontal','Edit view','filter')}${ib('history','Completed tasks','completed')}</div>${c.projects.length?`<div class="rq-small rq-muted">${c.projects.map(esc).join(' + ')}</div>`:''}<label class="rq-search">${I('search')}<input data-query value="${esc(c.query)}" placeholder="Find tasks…" aria-label="Find tasks"></label></div>${deletionReceipt()}${renderTaskList(list,c)}`;}

const nav=[['Work',[['Work mode','sliders-horizontal','work'],['Projects','folder','projects'],['Completed tasks','history','completed']]],['Environment',[['Agents & access','bot','agents'],['Resources','cpu','resources'],['Services','activity','services'],['Delivery','git-pull-request','delivery']]],['Personal',[['Appearance','type','appearance'],['Notifications','bell','notifications']]],['Support',[['Activity','chart-no-axes-column','activity'],['Recovery','rotate-cw','recovery'],['Diagnostics','file-text','diagnostics'],['About','info','about']]]];
function settings(){return nav.map(([g,items])=>`<div class="rq-group">${g}</div>${items.map(([n,i,id])=>`<button class="rq-navitem" data-route="${id}">${I(i)}${n}</button>`).join('')}`).join('');}
function appearance(){return `<section class="rq-section"><h3>${I('type')} Text</h3><div class="rq-options">${[14,16,18,20].map(n=>`<button data-font="${n}" aria-pressed="${model.font===n}">${n} px</button>`).join('')}</div></section><section class="rq-section"><h3>${I('chart-no-axes-column')} Tray icon</h3><div class="rq-row"><img src="${qSource()}" width="22" height="22" alt="Accepted compact Q icon"><span class="rq-small">Compact q · shared palette</span></div><div class="rq-small rq-muted">Action icons: Lucide · shared across both windows</div></section><section class="rq-section"><h3>${I('panels-top-left')} Window growth</h3><div class="rq-windowoptions">${[['auto','Auto'],['down','Down'],['up','Up'],['fixed','Fixed']].map(([v,n])=>`<button class="rq-windowoption" data-growth="${v}" aria-pressed="${model.growth===v}"><span class="rq-mini ${v==='auto'?model.opening:v}" aria-hidden="true"><i></i></span><span>${n}</span><small>${v==='auto'?'Follow anchor':v==='up'?'Bottom stays':v==='down'?'Top stays':'Scroll inside'}</small></button>`).join('')}</div><p>Auto follows the actual opening direction. Dragging keeps the selected mode.</p></section>`;}
function completedBody(){let list=completed.filter(t=>(model.historyProject==='All'||t.p===model.historyProject)&&(model.historyOutcome==='all'||t.outcome===model.historyOutcome)&&(`${t.id} ${t.title} ${t.result}`.toLowerCase().includes(model.historyQuery.toLowerCase()))&&(model.historyPeriod==='today'?t.daysAgo===0:model.historyPeriod==='7d'?t.daysAgo<7:t.daysAgo<30));return `<div class="rq-options">${[['today','Today'],['7d','7 days'],['30d','30 days']].map(([v,l])=>`<button data-period="${v}" aria-pressed="${model.historyPeriod===v}">${l}</button>`).join('')}</div><div class="rq-options">${['All','TaskQ','AgentQ','PilotQ'].map(p=>`<button data-history-project="${p}" aria-pressed="${model.historyProject===p}">${p}</button>`).join('')}</div><label class="rq-search">${I('search')}<input data-history-search value="${esc(model.historyQuery)}" placeholder="Title, issue or result…" aria-label="Find completed task"></label><div class="rq-tabs rq-small">${[['all','All outcomes'],['completed','Completed'],['cancelled','Cancelled'],['unknown','Unknown']].map(([v,l])=>`<button data-outcome="${v}" aria-pressed="${model.historyOutcome===v}">${l}</button>`).join('')}</div>${list.map(t=>`<article class="rq-task"><div class="rq-taskmeta"><button class="rq-reference" data-completed-detail="${t.id}">${brand('github')}${t.p} #${t.id}</button><span class="rq-space"></span><small>${t.day}</small></div><button class="rq-title" data-completed-detail="${t.id}">${t.title}</button><div class="rq-small ${t.outcome==='completed'?'rq-work':'rq-muted'}">${I(t.outcome==='completed'?'check-check':t.outcome==='cancelled'?'circle-slash':'circle-help')} ${t.result}</div></article>`).join('')||'<div class="rq-section rq-muted">No matching completed tasks</div>'}`;}
function policyInputs(){return `<div class="rq-options"><button data-policy-mode="Auto" aria-pressed="true">${I('gauge')}Auto</button><button data-policy-mode="Fixed" aria-pressed="false">${I('sliders-horizontal')}Fixed</button></div><label class="rq-row">Host maximum <input class="rq-cap-input" type="number" min="1" max="32" value="8" aria-label="Host maximum"></label><label class="rq-row">${brand('claude')}Claude cap<input class="rq-cap-input" type="number" min="1" max="32" value="6" aria-label="Claude cap"></label><label class="rq-row">${brand('openai')}Codex cap<input class="rq-cap-input" type="number" min="1" max="32" value="4" aria-label="Codex cap"></label><div class="rq-small rq-muted">Current attempts continue. Limits are ceilings, not running counts.</div><button data-action="policy-review">${I('scan-eye')}Review changes</button><div data-policy-review></div>`;}
function routeBody(id){if(id==='settings')return settings();if(id==='appearance')return appearance();if(id==='completed')return completedBody();if(id==='hosts'||id==='resources')return `${hostDetails()}<section class="rq-section"><h3>mac</h3><div class="rq-row"><span>Process counts</span><span>${brand('claude')} 2 · ${brand('openai')} 3</span></div><div class="rq-row"><span>Memory available</span><span>13 / 24 GB</span></div><div class="rq-row"><span>CPU load</span><span>24%</span></div><div class="rq-row"><span>Snapshot</span><span>12s ago</span></div></section><section class="rq-section"><h3>win <span class="rq-muted">· stale</span></h3><p>No fresh process or resource sample. Board task state does not establish host health.</p></section><button data-route="work">${I('sliders-horizontal')}Work mode & limits</button>`;if(id==='work')return `<section class="rq-section"><h3>mac · admission</h3>${policyInputs()}</section>`;if(id==='agents')return `<section class="rq-section"><h3>mac · runtime availability</h3><div class="rq-row">${brand('claude')}Claude<span class="rq-work">Available · 12s</span></div><div class="rq-row">${brand('openai')}Codex<span class="rq-work">Available · 12s</span></div><div class="rq-row">${brand('openai')}codex-app<span class="rq-muted">Disabled</span></div></section><section class="rq-section"><h3>Access</h3><div class="rq-row"><span>Requested</span><span>Workspace</span></div><div class="rq-row"><span>Saved</span><span>Workspace</span></div><div class="rq-row"><span>Applied</span><span>Unknown · probe required</span></div><div class="rq-options"><button data-access="Read only">Read only</button><button data-access="Workspace" aria-pressed="true">Workspace</button><button data-access="Full">Full</button></div><details><summary>Files, network and tools</summary>Effective permissions require a host-owned grant readback.</details><button disabled data-tooltip="Grant editing is not connected in this prototype">Review access change</button></section>`;if(id==='delivery')return `<section class="rq-section"><h3>Delivery by project</h3>${['TaskQ','AgentQ','PilotQ'].map(p=>`<div class="rq-row"><span>${I('folder')} ${p}</span><span class="rq-chip">Auto-merge · r2</span></div>`).join('')}<p>Publication policy is separate from runtime access. Changes need exact project review.</p><button disabled data-tooltip="No publication changes in a design preview">Review delivery changes</button></section>`;if(id==='projects')return `<section class="rq-section">${['TaskQ','AgentQ','PilotQ'].map(p=>`<div class="rq-row"><span>${I('folder')} ${p}</span><button data-project-filter="${p}">Show tasks</button></div>`).join('')}<button disabled data-tooltip="Requires the native folder picker and setup review">${I('plus')}Add project</button></section>`;if(id==='services')return `<section class="rq-section"><h3>mac · host service</h3><div class="rq-row"><span>Observed</span><span class="rq-work">Running · 12s ago</span></div><div class="rq-row"><span>Registered projects</span><span>3</span></div><p>TaskQ · AgentQ · PilotQ use this one host service.</p><div class="rq-options">${['Log','Folder','Restart','Stop','Uninstall'].map(x=>`<button disabled data-tooltip="Native service action is not connected">${x}</button>`).join('')}</div></section><section class="rq-section"><h3>win · host service</h3><p>Stale · refresh required before actions.</p></section>`;if(id==='notifications')return `<section class="rq-section"><h3>Events</h3>${[['Question','message-circle-question',true],['Failure','circle-x',true],['Completed','check-check',false]].map(([n,i,on])=>`<label class="rq-check"><input type="checkbox" ${on?'checked':''}>${I(i)}${n}</label>`).join('')}<h3>Delivery</h3>${['In-app','System','Sound'].map((n,i)=>`<label class="rq-check"><input type="checkbox" ${i===0?'checked':''}>${n}</label>`).join('')}<p>Prototype preferences only. System permission and notification delivery require native qualification.</p></section>`;if(id==='activity')return `<section class="rq-section"><h3>Activity · 24 hours</h3><div class="rq-bars" role="img" aria-label="Sample completed-event counts in six equal time bins: 2, 5, 3, 7, 4, 6">${[2,5,3,7,4,6].map(n=>`<i style="height:${n/7*100}%"></i>`).join('')}</div><div class="rq-row rq-small"><span>24h ago</span><span>Now</span></div><p>Event counts, not running tasks or CPU.</p><button data-route="completed">${I('history')}Browse completed tasks</button></section>`;if(id==='recovery')return `<section class="rq-section"><h3>No emergency hold in this sample</h3><p>After a stop, reconcile owned attempts and uncertain effects before reviewing resume. Recovery never starts from ordinary Play.</p><button disabled data-tooltip="No live emergency or recovery action in this prototype">Review recovery</button></section>`;if(id==='diagnostics')return `<section class="rq-section"><div class="rq-row"><span>Board read</span><span>12s ago</span></div><div class="rq-row"><span>mac service</span><span class="rq-work">Observed running</span></div><div class="rq-row"><span>win probe</span><span class="rq-muted">Stale</span></div><details><summary>Technical details</summary>Request IDs, paths and raw revisions belong here, not in the repeated task row.</details><button disabled data-tooltip="No diagnostic upload is performed">Review incident report</button></section>`;return `<section class="rq-section"><h3>TaskQ</h3><div class="rq-row"><span>Tray version</span><span>Unknown</span></div><div class="rq-row"><span>Service version</span><span>Unknown</span></div><button disabled data-tooltip="No verified update metadata in this sample">Check for updates</button></section>`;}
const routeTitle=id=>({tasks:'Tasks',settings:'Settings',appearance:'Appearance',completed:'Completed tasks',hosts:'Hosts',resources:'Resources',work:'Work mode',agents:'Agents & access',delivery:'Delivery',projects:'Projects',services:'Services',notifications:'Notifications',activity:'Activity',recovery:'Recovery',diagnostics:'Diagnostics',about:'About'})[id]||id;
function renderMenu(){if(!model.menuOpen){menu.innerHTML='<button data-action="reopen">Open task dashboard</button>';return;}const previous=taskViewport()?.scrollTop||0;menu.innerHTML=topbar()+`<main class="rq-main">${hosts()}${pinnedSection()}${model.route==='tasks'?'':`<div class="rq-heading">${ib('arrow-left','Back','back')}<h2>${routeTitle(model.route)}</h2></div>`}${model.route==='tasks'?tasksBody():routeBody(model.route)}</main>`+foot();taskViewport().scrollTop=previous;}
function selectedChat(){return model.chats.find(c=>c.id===model.selected)||model.chats[0];}
function composer(key,text,files,project,answer=false){return `<form class="rq-composer" data-composer="${key}" aria-label="${answer?'Task answer':'Request'} composer"><div class="rq-context">${I(answer?'message-circle-question':'folder')}<span>${esc(project)}${answer?' · current question':' · new native session'}</span>${answer?'':`<span class="rq-space"></span><button type="button" data-context="${key}" aria-label="Change project">${I('sliders-horizontal')}</button>`}</div><textarea data-compose-text="${key}" aria-label="${answer?'Other answer':'Message'}" placeholder="${answer?'Another answer or explanation…':'What would you like to do?'}">${esc(text)}</textarea><div data-files="${key}">${files.map((f,i)=>`<div class="rq-file">${I('file-text')}<span>${esc(f.name)} · ${Math.ceil(f.size/1024)} KB ${fileHandles.has(f.id)?'':'· reattach'}</span><button type="button" data-remove-file="${key}:${i}" aria-label="Remove ${esc(f.name)}">${I('x')}</button></div>`).join('')}</div><div class="rq-composebar"><input hidden type="file" multiple data-file-input="${key}" accept=".png,.jpg,.jpeg,.webp,.txt,.md,.pdf"><button type="button" data-attach="${key}" ${answer?'disabled data-tooltip="File answers need a qualified board adapter"':''} aria-label="Attach files">${I('paperclip')}</button><span class="rq-small rq-muted">${answer?'Exact question revision':'Claude · native'}</span><span class="rq-space"></span><button type="submit" class="rq-primary" aria-label="${answer?'Send answer':'Open native session'}">${I('arrow-up')}</button></div><div class="rq-error" data-compose-error role="alert"></div></form>`;}
function question(compact=false){return `<section class="rq-section"><div class="rq-small rq-muted">${compact?'':'TaskQ #104 · '}${I('message-circle-question')} Ask · 2h</div><h3>What should appear when a host is unavailable?</h3><button class="rq-choice rq-recommended" data-answer="1"><strong>1</strong><span>Keep the last data and mark it stale<small> · recommended</small></span>${I('arrow-up')}</button><button class="rq-choice" data-answer="2"><strong>2</strong><span>Hide the data until the next update</span>${I('arrow-up')}</button>${answerReceipt?`<div class="rq-scene-note" role="status">${answerReceipt}</div>`:''}${composer('answer',answerDraft,answerFiles,'TaskQ #104',true)}<details><summary>Context & stage history</summary><div class="rq-row"><span>Ready</span><span>2m</span></div><div class="rq-row"><span>Doing</span><span>15m</span></div><div class="rq-row rq-ask"><span>Ask · now</span><span>2h</span></div><div class="rq-row"><span>Total · 2 completed steps</span><span>2h 17m</span></div></details></section>`;}
function renderWorkspace(){if(!model.wsOpen){ws.innerHTML='<button data-action="open-workspace">Open workspace</button>';return;}const c=selectedChat(),archiveItems=model.chats.filter(x=>x.archived===model.archive);ws.innerHTML=`${windowHeader('workspace','Conversations',`<button data-action="new">${I('plus')}New</button>`)}<div class="rq-tabs">${[['inbox','bell','Inbox · 2'],['conversations','messages-square','Conversations'],['sessions','terminal','Work sessions']].map(([id,i,l])=>`<button data-tab="${id}" aria-selected="${model.tab===id}">${I(i)}${l}</button>`).join('')}</div><div class="rq-workarea"><aside class="rq-list">${model.tab==='conversations'?`<label class="rq-search">${I('search')}<input data-chat-search placeholder="Find…" aria-label="Find conversation"></label>${archiveItems.map(x=>`<button data-chat="${x.id}" aria-pressed="${x.id===model.selected}">${esc(x.title)}<small>${x.project} · ${x.status}</small></button>`).join('')}<button data-action="archive-list" aria-pressed="${model.archive}">${I('archive')}${model.archive?'Recent':'Archive'}</button>`:model.tab==='inbox'?'<button data-inbox="question" aria-pressed="true">Needs answer<small>TaskQ #104</small></button><button data-inbox="delivery">Not delivered<small>Request #1562</small></button>':tasks.filter(t=>['doing','review','failed'].includes(t.s)).map(t=>`<button data-work-session="${t.id}">${esc(t.p)} #${t.id}<small>${t.rt==='openai'?'Codex':'Claude'} · ${t.host}</small></button>`).join('')}</aside><section class="rq-detailarea"><div class="rq-inline"><button class="rq-narrow-list" data-action="list">${I('list')}List</button>${model.tab==='conversations'?`<h2 style="flex:1">${esc(c.title)}</h2>${ib('pencil','Rename request','rename')}${ib(c.archived?'archive-restore':'archive',c.archived?'Restore':'Archive','archive')}${ib('trash-2','Delete request record','delete-request')}`:''}</div><div class="rq-transcript">${model.tab==='inbox'?question():model.tab==='sessions'?'<section class="rq-section"><h3>Recorded worker / reviewer sessions</h3><p class="rq-muted rq-small">Select a task to inspect its recorded runtime, host and launch capability. A stopped session does not prove completion.</p></section>':`<section class="rq-section"><div class="rq-small rq-muted">${I(c.status==='Draft'?'file-pen-line':'external-link')} ${c.status} · ${esc(c.project)}</div>${c.status==='Draft'?'<p>Draft a request here; dialogue continues in the native runtime.</p>':'<h3>Native session launched</h3><p>Request history is retained here. Read and continue the dialogue in Claude.</p><button data-action="native">'+I('external-link')+'Open session</button>'}</section>`}<div data-workspace-detail></div></div>${model.tab==='conversations'&&c.status==='Draft'?composer(c.id,c.draft,c.files,c.project):''}<div class="rq-scene-note" data-workspace-note role="status">${lastArchived?'Archived · <button data-action="undo-archive">Undo</button>':''}</div></section></div>${foot()}`;}
function hydrate(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function renderSettings(){if(!model.settingsOpen)return;const id=model.settingsRoute;settingsWindow.innerHTML=windowHeader('settings','Settings')+`${id==='settings'?'':`<div class="rq-heading">${ib('arrow-left','Back to settings','settings-home')}<h2>${routeTitle(id)}</h2></div>`}<main class="rq-main">${routeBody(id)}</main>`+foot();}
function applyWindows(){root.classList.toggle('rq-enlarged',enlarged);menu.hidden=enlarged&&enlargedTarget!=='menu';settingsWindow.hidden=!model.settingsOpen||model.front!=='settings'||enlarged&&enlargedTarget!=='settings';ws.hidden=model.front==='settings'&&model.settingsOpen||enlarged&&enlargedTarget!=='workspace';root.dataset.large=enlarged?enlargedTarget:'';}
function render(){root.style.setProperty('--rq-size',model.font+'px');root.classList.toggle('rq-enlarged',enlarged);renderMenu();renderWorkspace();renderSettings();applyWindows();hydrate();}
function openSettings(id=model.settingsRoute||'settings'){closePop();model.settingsOpen=true;model.settingsRoute=id;model.front='settings';enlarged=false;renderSettings();applyWindows();hydrate();persist();}

function closePop(){if(pop.matches(':popover-open'))pop.hidePopover();activePop=null;}
function openPop(html,trigger,kind){closePop();activePop=kind;popTrigger=trigger;pop.innerHTML=html;for(const b of pop.querySelectorAll('[data-action=task-pin]')){b.classList.remove('rq-icon');b.append(document.createTextNode(pins().includes(+b.dataset.taskRef)?'Unpin task':'Pin to top'));}pop.showPopover();hydrate();const r=trigger?.getBoundingClientRect()||menu.getBoundingClientRect(),b=root.getBoundingClientRect();pop.style.width=Math.min(kind==='filter'?410:390,b.width-16)+'px';const p=pop.getBoundingClientRect();pop.style.left=Math.max(b.left+5,Math.min(r.left,b.right-p.width-5))+scrollX+'px';pop.style.top=Math.max(b.top+5,Math.min(r.bottom+4,menu.getBoundingClientRect().bottom-p.height-6))+scrollY+'px';}
const pophead=(title,actions='')=>`<div class="rq-pophead"><strong>${title}</strong>${actions}${ib('x','Close details','close-pop')}</div>`;

function views(trigger){openPop(pophead('Saved views')+model.views.map(v=>`<div class="rq-row"><button class="rq-view-name" data-view="${v.id}" aria-current="${v.id===view().id}">${I(v.id===view().id?'check':'bookmark')}<span>${esc(v.name)}</span></button><button data-star="${v.id}" aria-pressed="${v.star}" aria-label="${v.star?'Unpin shortcut':'Pin shortcut'} ${esc(v.name)}" data-tooltip="${v.star?'Unpin shortcut':'Pin shortcut'}">${I('star')}</button>${canDeleteView(v)?`<button data-delete-view="${v.id}" aria-label="Delete ${esc(v.name)}" data-tooltip="Delete saved view">${I('trash-2')}</button>`:''}</div>`).join('')+deletionReceipt()+'<button data-action="save-copy">'+I('bookmark-plus')+'Save as…</button>',trigger,'views');}

function showTask(id,trigger){changeWorking({selection:id});for(const b of menu.querySelectorAll('[data-task]'))b.setAttribute('aria-current',String(+b.dataset.task===id));persist();const t=tasks.find(t=>t.id===id);openPop(pophead(`${t.p} #${t.id}`,ib(pins().includes(id)?'pin-off':'pin',pins().includes(id)?'Unpin task':'Pin task to top','task-pin',`data-task-ref="${id}" aria-pressed="${pins().includes(id)}"`))+(t.s==='ask'?question(true):`<h3>${esc(t.title)}</h3><div class="rq-inline ${tint(t.s)}">${I(glyph[t.s])}${names[t.s]} · ${time(t.age)}</div>${t.s==='failed'?'<p class="rq-small">Gateway connection failed. Inspect the evidence before retrying.</p>':t.s==='blocked'?'<p class="rq-small">Waiting for the shared resource adapter. Timing unavailable.</p>':''}<div class="rq-row rq-small">${brand(t.rt)}${t.rt==='openai'?'Codex':'Claude'}<span>${t.host||'Not assigned'}</span></div><button data-session="${id}" ${t.host!=='mac'?'disabled data-tooltip="No verified session target here"':''}>${I('external-link')}Open session</button><button data-issue="${id}">${brand('github')}Open issue</button><details><summary>Stage history & total</summary><div class="rq-row"><span>Ready</span><span>2m</span></div><div class="rq-row"><span>Current step</span><span>${time(t.age)}</span></div><div class="rq-row"><span>Total</span><span>${t.age===null?'Unknown':time(t.age+120)}</span></div></details><details><summary>Technical context</summary><span class="rq-muted">Recorded attempt and revision appear here when supplied. No UUID is fabricated.</span></details>`),trigger,'task');}
function navigate(route){if(!['tasks','completed'].includes(route)){openSettings(route);return;}closePop();if(model.route==='tasks')changeWorking({scroll:taskViewport()?.scrollTop||0});model.route=route;renderMenu();taskViewport()?.scrollTo(0,route==='tasks'?(working().scroll||0):0);hydrate();persist();}

function updateComposerFileUI(key){const c=key==='answer'?{files:answerFiles}:model.chats.find(x=>x.id===key);const forms=root.querySelectorAll(`[data-composer="${key}"]`);for(const form of forms){const text=form.querySelector('textarea').value;form.outerHTML=composer(key,text,c.files,key==='answer'?'TaskQ #104':c.project,key==='answer');}hydrate();}

function ingestFiles(key,files){const c=model.chats.find(x=>x.id===key);if(!c)return;let error='';for(const f of files){if(!/\.(png|jpe?g|webp|txt|md|pdf)$/i.test(f.name)){error='Unsupported file: '+f.name;continue;}const id='file-'+Date.now()+'-'+c.files.length;c.files.push({id,name:f.name,size:f.size});fileHandles.set(id,f);}updateComposerFileUI(key);root.querySelector(`[data-composer="${key}"] [data-compose-error]`).textContent=error||'Preview only · bytes stay local; transport limits unqualified.';persist();}
