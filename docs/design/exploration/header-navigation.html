<script>
(()=>{
const root=document.getElementById('tq-header-session');
const reviewControls=document.getElementById('tq-header-controls');
const I=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const forge='<span class="qs-forge" aria-hidden="true"></span>';
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={ask:'message-circle-question',review:'scan-eye',doing:'loader',failed:'circle-x',blocked:'git-pull-request-arrow',ready:'circle'};
const names={ask:'Question',review:'Review',doing:'Doing',failed:'Failed',blocked:'Blocked',ready:'Ready'};
const navGroups=[
 ['Work',[['Work mode','sliders-horizontal','work'],['Projects','folder','projects']]],
 ['Environment',[['Agents','bot','agents'],['Services','activity','services']]],
 ['Personal',[['Appearance','type','appearance'],['Notifications','bell','preferences']]],
 ['Support',[['Activity history','chart-no-axes-column','activity'],['Diagnostics','file-text','diagnostics'],['About','info','about']]]
];
const actionIcon=(icon,label,attributes)=>'<button class="qs-ghost cursor-interaction" aria-label="'+label+'" data-tooltip="'+label+'" '+attributes+'>'+I(icon)+'</button>';
function header(app){return '<header class="qs-header"><button class="qs-host-button cursor-interaction" data-open="controls" aria-label="Mac status and work mode" data-tooltip="Mac · Auto · system status">Mac · Auto</button>'+actionIcon('pause','Pause new work','data-open="pause"')+actionIcon('square','Emergency stop','data-open="emergency"')+(app.dataset.nav==='direct'?actionIcon('bell','Inbox','data-nav-page="inbox"')+actionIcon('messages-square','Conversations','data-workspace="conversations"')+actionIcon('settings','Settings','data-action="settings"'):actionIcon('menu','Navigation menu','data-action="settings"'))+actionIcon('pin','Keep menu open','data-action="window-pin" aria-pressed="'+model.pin+'"')+'</header><div class="qs-overview" aria-label="All observed tasks">'+['doing','review','ask','failed','ready','blocked'].map(state=>'<button class="cursor-interaction '+(['doing','review'].includes(state)?'qs-work':state==='ask'?'qs-ask':state==='failed'?'qs-failed':'')+'" data-state="'+state+'" aria-label="'+names[state]+': 1 task" data-tooltip="'+names[state]+' · all projects">'+I(icons[state])+'1</button>').join('')+'</div>'}
const tasks=[
 {id:104,title:'Choose the menu layout',project:'TaskQ',state:'ask',runtime:'Claude',host:'Mac',priority:0,chain:[['Ready',120],['Doing',900],['Question',7200]]},
 {id:103,title:'Recover a request after a connection failure',project:'TaskQ',state:'review',runtime:'Codex',host:'Mac',priority:1,chain:[['Ready',120],['Doing',600],['Review',180],['Doing',300],['Review',120]]},
 {id:105,title:'Keep drafts when switching conversations',project:'AgentQ',state:'doing',runtime:'Codex',host:'Mac',priority:2,chain:[['Ready',180],['Doing',2400]]},
 {id:106,title:'Restore the gateway connection',project:'PilotQ',state:'failed',runtime:'Claude',host:'Windows',priority:1,chain:[['Ready',60],['Doing',420],['Review',80],['Failed',300]]},
 {id:102,title:'Wait for the shared resource adapter',project:'AgentQ',state:'blocked',runtime:'Codex',host:'Windows',priority:2,chain:[['Ready',120],['Doing',480],['Blocked',5400]]},
 {id:101,title:'Bundle monochrome menu icons',project:'TaskQ',state:'ready',runtime:'Claude',host:'Mac',priority:3,chain:[['Ready',1200]]}
];
const age=t=>t.chain.at(-1)[1],total=t=>t.chain.reduce((a,s)=>a+s[1],0),time=s=>s>=3600?Math.floor(s/3600)+'h'+(Math.floor(s%3600/60)?' '+Math.floor(s%3600/60)+'m':''):s>=60?Math.floor(s/60)+'m'+(s%60?' '+s%60+'s':''):s+'s';
const defaults=[{id:'all',name:'All tasks',project:'all',state:'all',sort:'priority',group:'project',star:true},{id:'attention',name:'Attention',project:'all',state:'attention',sort:'priority',group:'none',star:true},{id:'taskq',name:'TaskQ',project:'TaskQ',state:'all',sort:'priority',group:'none',star:true},{id:'long',name:'Long running',project:'all',state:'long',sort:'age',group:'none',star:false}];
let model={version:4,views:structuredClone(defaults),selected:'all',draft:null,query:'',workspaces:{},pin:false,font:16,trayView:'icon'};
const status=text=>{root.querySelector('.qs-status').textContent=text};
const hydrate=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})};
const validCriteria=v=>v&&['all','TaskQ','AgentQ','PilotQ'].includes(v.project)&&['all','active','attention','long',...Object.keys(names)].includes(v.state)&&['priority','age','total'].includes(v.sort)&&['project','none'].includes(v.group);
function restore(snapshot){const s=snapshot?.privateContent;if(s?.version!==4||!Array.isArray(s.views)||!s.views.length)return false;const valid=s.views.every(v=>typeof v.id==='string'&&typeof v.name==='string'&&v.name.length<=40&&validCriteria(v));if(!valid)return false;const workspaces={};for(const v of s.views){const w=s.workspaces?.[v.id];if(w)workspaces[v.id]={draft:validCriteria(w.draft)?w.draft:null,query:typeof w.query==='string'?w.query.slice(0,160):''}}model={version:4,views:s.views.map(v=>({...v,star:!!v.star})),selected:s.views.some(v=>v.id===s.selected)?s.selected:s.views[0].id,draft:validCriteria(s.draft)?s.draft:null,query:typeof s.query==='string'?s.query.slice(0,160):'',workspaces,pin:s.pin===true,font:[14,16,18,20].includes(s.font)?s.font:16,trayView:['icon','summary','custom'].includes(s.trayView)?s.trayView:'icon'};return true}
restore(window.openai?.widgetState);
const selected=()=>model.views.find(v=>v.id===model.selected)||model.views[0],criteria=()=>model.draft||selected();
function remember(){model.workspaces[model.selected]={draft:model.draft,query:model.query}}
function selectView(id){remember();model.selected=id;const w=model.workspaces[id];model.draft=w?.draft||null;model.query=w?.query||''}
function setDraft(next){model.draft=['project','state','sort','group'].every(key=>next[key]===selected()[key])?null:next}
function saveState(){remember();if(!window.openai?.setWidgetState)return;if(JSON.stringify(model).length>14000){status('Preview storage is full; changes remain in this session.');return}window.openai.setWidgetState({modelContent:{prototype:'header-navigation-comparison',activeView:selected().name,modified:!!model.draft},privateContent:model}).catch(()=>status('View remains available in this preview; saving was unavailable.'))}
function match(t,c,q=''){return(c.project==='all'||t.project===c.project)&&(c.state==='all'||(c.state==='active'?['doing','review'].includes(t.state):c.state==='attention'?['ask','failed'].includes(t.state):c.state==='long'?age(t)>=1800:t.state===c.state))&&(t.project+' '+t.id+' '+t.title).toLowerCase().includes(q.trim().toLowerCase())}
