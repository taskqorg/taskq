  hydrate();
 }
 app.addEventListener('input',event=>{if(event.target.type==='search'){model.query=event.target.value;renderAll();saveState()}});

  if(b.dataset.action==='settings'){navigation(b);return}

// shortcut: dragging is bounded to this preview stage; native monitor placement needs platform qualification.
function validPosition(p){return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&Math.abs(p.x)<10000&&Math.abs(p.y)<10000}
function movePanel(start,dx,dy,limit,active=false){if(!active&&Math.hypot(dx,dy)<4)return null;return{x:Math.max(-limit.x,Math.min(limit.x,start.x+dx)),y:Math.max(-24,Math.min(56,start.y+dy))}}
console.assert(movePanel({x:0,y:0},2,1,{x:100})===null,'Click jitter does not pin');
console.assert(movePanel({x:0,y:0},20,12,{x:100}).x===20,'First drag moves without a second gesture');
console.assert(movePanel({x:0,y:0},200,80,{x:100}).x===100,'Preview movement stays in bounds');
console.assert(!validPosition({x:Infinity,y:0})&&validPosition({x:12,y:4}),'Saved position validation');
function updateWindow(){const app=apps[0].app,limit=Math.max(0,(root.querySelector('.qs-comparison').clientWidth-app.offsetWidth)/2);const pos=model.pin?{x:Math.max(-limit,Math.min(limit,model.position.x)),y:Math.max(-24,Math.min(56,model.position.y))}:{x:0,y:0};app.style.setProperty('--window-x',pos.x+'px');app.style.setProperty('--window-y',pos.y+'px');const pin=app.querySelector('[data-action="window-pin"]');pin.setAttribute('aria-pressed',String(model.pin));pin.setAttribute('aria-label',model.pin?'Unpin window':'Keep window open');pin.setAttribute('data-tooltip',model.pin?'Unpin · return to tray':'Keep window open');status(app.hidden?'Panel closed · mode and working view retained':model.pin?'Pinned · stays open outside the panel':'Popover · drag the header to keep open')}
function hidePanel(focus=true){apps[0].closeEditor();apps[0].app.hidden=true;updateWindow();saveState();if(focus)reviewControls.querySelector('[data-launch]').focus()}
function showPanel(){apps[0].app.hidden=false;updateWindow();apps[0].app.querySelector('[data-action="window-close"]').focus()}
let drag=null,suppressClick=false;
root.addEventListener('pointerdown',event=>{const handle=event.target.closest('.qs-header');if(!handle||event.button!==0||event.target.closest('button:not([data-drag])'))return;drag={target:event.target.closest('[data-drag]')||handle,id:event.pointerId,x:event.clientX,y:event.clientY,start:model.pin?{...model.position}:{x:0,y:0},active:false}});
document.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;const app=apps[0].app,limit={x:Math.max(0,(root.querySelector('.qs-comparison').clientWidth-app.offsetWidth)/2)},position=movePanel(drag.start,event.clientX-drag.x,event.clientY-drag.y,limit,drag.active);if(!position)return;if(!drag.active){apps[0].closeEditor();drag.active=true;drag.target.setPointerCapture(event.pointerId)}event.preventDefault();model.pin=true;model.position=position;updateWindow()},{passive:false});
function endDrag(event){if(!drag||event.pointerId!==drag.id)return;if(drag.active){suppressClick=true;saveState();if(drag.target.hasPointerCapture(event.pointerId))drag.target.releasePointerCapture(event.pointerId)}drag=null}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
root.addEventListener('click',event=>{if(suppressClick){event.preventDefault();event.stopImmediatePropagation();suppressClick=false}},true);
document.addEventListener('pointerdown',event=>{suppressClick=false;const app=apps[0].app;if(!app.hidden&&!model.pin&&!app.contains(event.target)&&!reviewControls.contains(event.target))hidePanel(false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.defaultPrevented&&!apps[0].app.hidden&&!apps[0].app.querySelector(':popover-open')){event.preventDefault();hidePanel()}});
new ResizeObserver(updateWindow).observe(root.querySelector('.qs-comparison'));
function applyWindowSize(){const app=apps[0].app;if(model.windowSize){app.style.width=model.windowSize.width+'px';app.style.height=model.windowSize.height+'px'}else{app.style.width='470px';app.style.height='auto'}const r=app.getBoundingClientRect();app.querySelector('[data-size-label]').textContent=model.windowSize?Math.round(r.width)+' × '+Math.round(r.height):'';updateWindow()}
function resizedSize(width,height,maxWidth){return{width:Math.round(Math.max(Math.min(320,maxWidth),Math.min(Math.min(800,maxWidth),width))),height:Math.round(Math.max(260,Math.min(760,height)))}}
console.assert(resizedSize(1000,10,640).width===640&&resizedSize(1000,10,640).height===260,'Resize respects preview bounds');
function resizeWindow(width,height,commit){model.windowSize=resizedSize(width,height,root.querySelector('.qs-comparison').clientWidth);applyWindowSize();if(commit)saveState()}
let resize=null;
root.addEventListener('pointerdown',event=>{const grip=event.target.closest('[data-resize]');if(!grip||event.button!==0)return;event.preventDefault();const r=apps[0].app.getBoundingClientRect();resize={id:event.pointerId,x:event.clientX,y:event.clientY,width:r.width,height:r.height,target:grip};grip.focus();grip.setPointerCapture(event.pointerId)});
document.addEventListener('pointermove',event=>{if(!resize||event.pointerId!==resize.id)return;event.preventDefault();resizeWindow(resize.width+event.clientX-resize.x,resize.height+event.clientY-resize.y,false)},{passive:false});
function endResize(event){if(!resize||event.pointerId!==resize.id)return;saveState();if(resize.target.hasPointerCapture(event.pointerId))resize.target.releasePointerCapture(event.pointerId);resize=null}

root.addEventListener('keydown',event=>{if(!event.target.closest('[data-resize]')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();const r=apps[0].app.getBoundingClientRect();resizeWindow(r.width+(event.key==='ArrowRight'?16:event.key==='ArrowLeft'?-16:0),r.height+(event.key==='ArrowDown'?16:event.key==='ArrowUp'?-16:0),true)});
function applyPreferences(){apps.forEach(({app})=>{app.style.fontSize=model.font+'px';app.querySelector('[data-chrome]').innerHTML=header(app);renderFacets(app)});root.querySelector('section[data-workspace]').style.fontSize=model.font+'px';hydrate();applyWindowSize()}

renderAll();
applyPreferences();

if(globalThis.Tweak){const tuning={font:model.font};const tweak=new Tweak({container:root,onChange:()=>{model.font=tuning.font;applyPreferences()}});tweak.addSlider(tuning,'font',{label:'Text size',min:14,max:20,step:2,unit:'px'})}
