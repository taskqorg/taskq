html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:transparent}

body{max-width:100%}

.row,summary{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:32px;padding:5px 4px;line-height:1.35}

.hist>summary>.meta{white-space:normal;overflow:visible;text-align:right}
summary::-webkit-details-marker{display:none}

details[open]>summary:after{transform:rotate(90deg)}
.muted,.meta{color:var(--muted);font-size:max(12px,.85em)}
.group{border-top:1px solid var(--edge);margin-top:5px;padding-top:5px}
.body{padding:5px 4px;line-height:1.45;overflow-wrap:anywhere}
.project:hover,.project:focus-visible{background:light-dark(#e9edf1,#37424c)}
.project{width:100%;border:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;text-align:left;min-height:33px;padding:5px 4px}
.project>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.menu .tqp{--good:var(--work);--ask:inherit;--bad:var(--failed)}

.menu .qac{--qac-work:var(--work);--qac-ask:var(--ask);--qac-failed:var(--failed)}
.menu .rsc{--rsc-work:var(--work);--rsc-ask:var(--ask);--rsc-failed:var(--failed)}
.menu .tqf{--tqf-good:var(--work)}

.options{display:flex;gap:5px;flex-wrap:wrap;padding:4px}
.options button{flex:1 0 38px}.options [data-a^=notify]{flex-basis:auto;padding-inline:4px}
.options button.rec{border-color:var(--work);font-weight:600}
button[aria-pressed=true]{background:light-dark(#dce7e1,#354a40);border-color:var(--work)}
.periods button{flex:1 0 auto;padding:4px 6px}
.views button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;font-size:.9em}
.views img{height:18px}

.alert{color:var(--failed)}
.toast{position:fixed;left:8px;right:8px;bottom:8px;z-index:12;padding:6px 8px;border:1px solid var(--work);border-radius:8px;background:var(--surface);box-shadow:0 4px 14px #0006;overflow-wrap:anywhere}.toast button{margin-left:6px}
h1{font-size:1em;margin:6px 4px;overflow-wrap:anywhere}.footer{border-top:1px solid var(--edge);margin-top:6px}
.head{flex-shrink:0;z-index:10;background:light-dark(#edf0f3,#303840);min-height:32px;padding:3px 8px;cursor:grab}.head nav,.window-controls{display:flex;gap:4px}.pin-glyph{display:inline-block}.head button{padding:2px 7px}.grip{position:fixed;right:0;bottom:0;width:18px;height:18px;z-index:11;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--muted) 56%,var(--muted) 62%,transparent 63%,transparent 75%,var(--muted) 76%,var(--muted) 82%,transparent 83%)}
/* Home keeps a bounded preview of the AI exchange and of the proposed changes (menu.md M7); controls stay below them */
.askai{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:4px}
.askai textarea{font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px;resize:vertical;min-width:0;-webkit-user-select:text;user-select:text}

.history-plot{position:relative;height:88px;margin:4px 12px}
.history-plot svg{display:block;width:100%;height:100%}.history-plot #counters,.history-plot #empty-q{display:none}.history-plot #summary-data,.history-plot [data-mark=ask]{visibility:visible}
.history-targets{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr)}

.menu .history-targets button[aria-pressed=true]{background:none;outline:1px solid var(--muted);outline-offset:1px}
.menu .history-targets button:focus-visible{outline:2px solid var(--muted);outline-offset:1px}
.summary-preview,.summary-preview svg{display:inline-block;width:18px;height:18px}

.history-legend{display:flex;flex-wrap:wrap;gap:4px 12px}.history-legend span{white-space:nowrap}.history-legend i{display:inline-block;width:8px;height:8px;margin-right:4px;background:currentColor}
.history-selection{display:inline-flex;position:relative}.history-selection select{appearance:none;font:inherit;color:inherit;background:transparent;border:1px solid var(--edge);border-radius:4px;padding:3px 2em 3px 6px}.history-selection .ui-icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);pointer-events:none}
.range{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;padding:4px}

.recovery-evidence{display:block;margin-top:.4em}.recovery-evidence input{display:block;box-sizing:border-box;width:100%;font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px;margin-top:3px}.recovery-evidence input:disabled{opacity:.6}
@media(pointer:coarse){button,summary{min-height:44px}}
.tqp-counts button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
/* The content body's margins stay inside its natural-height measurement. */
.content-body{display:flow-root}
.row-actions .task-controls{display:contents}

/* TaskQ shared answer card (docs/design/answer-card.md); tokens are the visual-style.md palette, layout the plans-and-decisions.html qcard. Size inherits the host font (16-20 px). */
.qac{--qac-fg:light-dark(#243039,#eef2f5);--qac-muted:light-dark(#59636e,#b9c3cd);--qac-edge:light-dark(#dce0e5,#46505b);--qac-hover:light-dark(#e9edf1,#37424c);--qac-work:light-dark(#246f59,#8dd2b8);--qac-ask:light-dark(#955525,#edbc96);--qac-failed:light-dark(#a6324b,#ee96a5);color:var(--qac-fg);line-height:1.4;min-width:0;overflow-wrap:anywhere;border-top:1px solid var(--qac-edge);padding:7px 2px}
.qac *{box-sizing:border-box}
.qac p{margin:4px 0}
.qac a{color:inherit}
.qac-mark{color:var(--qac-ask)}
.qac-muted,.qac-why{color:var(--qac-muted)}
.qac-text{white-space:pre-wrap;font:inherit;margin:.25em 0}
.qac-choices{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap;margin:6px 0}
.qac-number{font-variant-numeric:tabular-nums;flex:none}
.qac details{margin:5px 0}
.qac summary{min-height:30px;cursor:pointer}
.qac button{font:inherit;color:inherit;background:none;border:0;border-radius:5px;padding:4px 6px;min-height:32px;text-align:left;cursor:pointer}
.qac-choices button{display:flex;align-items:baseline;gap:6px;background:var(--qac-hover);white-space:normal}
.qac button:disabled{opacity:.55;cursor:default}
.qac button:focus-visible,.qac textarea:focus-visible,.qac a:focus-visible{outline:2px solid var(--qac-ask);outline-offset:1px}
.qac-star{color:var(--qac-ask)}
.qac-why,.qac-link{font-size:.875em;padding-left:.6em;flex-basis:100%}
.qac-text-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em;align-items:start}
.qac textarea{font:inherit;color:inherit;background:none;border:1px solid var(--qac-edge);border-radius:4px;padding:.3em;resize:vertical;min-width:0;width:100%}
.qac-receipt:empty,.qac-hint:empty{display:none}
.qac-hint{grid-column:1/-1;font-size:.875em;color:var(--qac-ask)}
.qac-sending,.qac-unknown,.qac-stale{color:var(--qac-ask)}
.qac-accepted{color:var(--qac-work)}
.qac-rejected{color:var(--qac-failed)}
.qac-read-only{color:var(--qac-muted)}
@media(pointer:coarse){.qac button{min-height:44px}}

/* Parent: menu-next-variants.html (#943), visual-style.md. Scoped internals belong to TaskQ. */
.tqp{--paper:light-dark(#fafbfc,#252b32);--ink:light-dark(#243039,#eef2f5);--secondary:light-dark(#59636e,#b9c3cd);--line:light-dark(#dce0e5,#46505b);--hover:light-dark(#e9edf1,#37424c);--good:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);--bad:light-dark(#a6324b,#ee96a5);font:inherit;line-height:1.4;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tqp,.tqp *{box-sizing:border-box}
.tqp button{font:inherit;color:inherit;border:0;background:transparent;border-radius:5px;padding:4px 6px;min-width:32px;min-height:32px;text-align:left;max-width:100%;overflow-wrap:anywhere}
.tqp a{color:inherit;text-decoration:none;border-radius:5px;display:inline-block;min-width:32px;min-height:32px;padding:4px 0}
.tqp button:hover,.tqp a:hover{background:var(--hover)}
.tqp button:focus-visible,.tqp a:focus-visible{outline:2px solid var(--good);outline-offset:1px}
.tqp svg{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex-shrink:0}
.tqp svg:not([fill]){fill:currentColor}
.tqp .good{color:var(--good)}.tqp .ask{color:var(--ask)}.tqp .danger{color:var(--bad)}
.tqp small,.tqp-meta,.tqp-partial{color:var(--secondary);font-size:max(12px,.85em)}
.tqp-meta{white-space:nowrap}
.tqp-project{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;padding:3px 0}
.tqp-identity{display:flex;align-items:center;flex-wrap:wrap;gap:4px;max-width:100%}
.tqp-project>.tqp-counts{margin-left:auto;max-width:100%}
.tqp-counts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
/* One chip style (#1523): icon alone, or icon and count, centered as one group with equal padding. */
.tqp-counts button{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:32px;padding:2px 6px;border-radius:20px;background:var(--hover);white-space:nowrap;text-align:center}
.tqp-counts svg{vertical-align:0}
.tqp-project .tqp-counts{gap:2px}
.tqp-partial{display:block;width:100%}
.tqp-task-head .tqp-meta{white-space:normal}
.tqp-task{display:block;width:100%;padding:5px 4px;overflow-wrap:anywhere}
@media(pointer:coarse){.tqp button,.tqp a{min-width:44px;min-height:44px}}

/* TaskQ shared resource controls (docs/design/shared-resource-controls.md); tokens are the visual-style.md palette shared with answer-card.css, rows the tray Capacity group. Size inherits the host font (16-20 px). */
.rsc{--rsc-fg:light-dark(#243039,#eef2f5);--rsc-muted:light-dark(#59636e,#b9c3cd);--rsc-edge:light-dark(#dce0e5,#46505b);--rsc-hover:light-dark(#e9edf1,#37424c);--rsc-work:light-dark(#246f59,#8dd2b8);--rsc-ask:light-dark(#955525,#edbc96);--rsc-failed:light-dark(#a6324b,#ee96a5);color:var(--rsc-fg);line-height:1.4;min-width:0;overflow-wrap:anywhere;padding:2px 4px}
.rsc *{box-sizing:border-box}
.rsc p{margin:3px 0}
.rsc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rsc-row>span:last-child{text-align:right;margin-left:auto}
.rsc-count{font-variant-numeric:tabular-nums}
.rsc-muted,.rsc-why{color:var(--rsc-muted)}
.rsc-over .rsc-count,.rsc-alert,.rsc-rejected{color:var(--rsc-failed)}
.rsc-sending,.rsc-saved,.rsc-unknown{color:var(--rsc-ask)}
.rsc-applied{color:var(--rsc-work)}
.rsc-form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;margin:4px 0}
.rsc-why{grid-column:1/-1;font-size:.875em}
.rsc input[type=number]{font:inherit;font-size:.9em;min-width:0;width:100%;color:inherit;background:none;border:1px solid var(--rsc-edge);border-radius:4px;padding:3px}
.rsc input[type=checkbox]{justify-self:start;width:1.1em;height:1.1em}
.rsc-review{border-top:1px solid var(--rsc-edge);padding-top:4px}
.rsc-actions{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.rsc button{font:inherit;color:inherit;background:var(--rsc-hover);border:0;border-radius:5px;padding:4px 8px;min-height:32px;text-align:left;cursor:pointer}
.rsc button:disabled,.rsc input:disabled{opacity:.55;cursor:default}
.rsc button:focus-visible,.rsc input:focus-visible{outline:2px solid var(--rsc-ask);outline-offset:1px}
@media(pointer:coarse){.rsc button{min-height:44px}}

/* TW1/TW8, V09/V20–V26: per-surface tokens; icon calibration remains independent. */
.menu{--outer:8px;--row:4px;--related:4px;--section:6px;--target:32px;--edge:light-dark(#727d89,#8896a4)}
.menu.workspace{--outer:12px;--row:6px;--related:6px;--section:12px}
.shell{display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden}
.menu .content{padding:var(--outer);scroll-padding-block:var(--outer)}
.menu .group{margin-top:var(--section);padding-top:var(--section);border-top-width:1px}
/* R07: row 1 is Home, the flexible title slot, actions and window controls; Back, breadcrumbs and a long title use row 2. */
.menu .head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:var(--related);padding:4px var(--outer);flex:none;cursor:grab}
.head .nav-home{grid-column:1;grid-row:1}
.head .nav-title{grid-column:2;grid-row:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:0 var(--related)}
.head:is(.title-below,[data-title-below]) .nav-title{grid-column:1/-1;grid-row:2;flex-wrap:nowrap}
.head .nav-actions{grid-column:3;grid-row:1}.head .window-controls{grid-column:4;grid-row:1}
.head h1{font-size:1.1em;font-weight:600;line-height:1.25;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head:is(.title-below,[data-title-below]) h1{flex:1 1 0;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:manual;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.head h1:focus{outline:none}
.head .breadcrumbs::after{content:"›";margin-inline-start:4px}
.head .nav-actions,.head .window-controls{display:flex;align-items:center;gap:var(--related)}
.head .window-controls{border-inline-start:1px solid var(--edge);padding-inline-start:var(--related)}
.head button{display:inline-flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
.menu :is(button,summary,select,input:not([type=checkbox]),textarea,[role=button]),.menu a{min-width:var(--target);min-height:var(--target)}
.menu a{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;overflow-wrap:anywhere}
.menu :is(button,select,input,textarea){max-width:100%}
.menu :is(button,a,summary,input,select,textarea,[role=button]):focus-visible{outline:2px solid var(--work);outline-offset:-2px}
.menu button[aria-pressed=true],.menu [aria-current=page]{outline:2px solid currentColor;outline-offset:-2px;background:light-dark(#e9edf1,#37424c);border-color:transparent}
.menu .breadcrumbs{display:flex;flex-wrap:wrap;gap:0 4px;color:var(--muted);font-size:max(12px,.85em);line-height:1.25}
.menu .breadcrumbs a{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.menu .grip{position:static;width:var(--target);height:var(--target);min-height:var(--target);flex:none;align-self:flex-end}
.menu label:has(input[type=checkbox]){display:flex;align-items:center;gap:var(--related);min-width:var(--target);min-height:var(--target)}
.menu .shell-overflow{position:relative}
.menu .shell-overflow>summary{display:flex;justify-content:center;padding:4px;cursor:pointer;list-style:none}
.menu .shell-overflow>summary::after{display:none}
.menu .overflow-actions{position:absolute;inset-inline-end:0;top:100%;width:min(280px,calc(100vw - 16px));max-height:60vh;overflow:auto;display:grid;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--edge);z-index:20;cursor:default}
.menu .overflow-actions button{justify-content:start;text-align:start}
.menu .nav-actions .quick-actions{display:none}
.menu h2,.menu strong{font-size:1em;font-weight:600}
.menu .row,.menu summary{padding-inline:var(--row)}
.menu .range input,.menu .range select,.menu .views button{font-size:1em}
.menu :is(input:not([type=checkbox]),select,textarea){border-color:var(--edge)}
.menu .group>.row{font-size:1em;font-weight:600}
@media(pointer:coarse){.menu{--target:44px}}
@media(min-width:640px){.menu .nav-actions .quick-actions{display:flex;gap:4px}}
@media(prefers-reduced-motion:reduce){.menu *{scroll-behavior:auto}}
/* Request form uses the workspace's type and spacing, including native textarea controls. */
.workspace label[for=request-project],.workspace form[data-form=request]>label{display:block;margin-block:var(--related)}
.workspace #request-project{display:block}
.workspace [data-form=request] textarea{display:block;width:100%;box-sizing:border-box;font:inherit;line-height:1.4;resize:vertical}
.workspace [data-form=request] .options{justify-content:flex-end}
.workspace [data-a=request-send]{flex:none}
/* R09: the Conversations count sits on its icon, so the icon keeps its place whatever the count. */
.head .conversations-entry{position:relative}
/* the count keeps its own fill and digits: the injected palette may be absent and --surface is a body token */
.head .conversations-entry .badge{position:absolute;top:0;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ask,light-dark(#995200,#FFC247));color:light-dark(#fafbfc,#252b32);font-size:10px;font-weight:600;line-height:14px;text-align:center;pointer-events:none}
/* R17/R28: units stay beside their meters; definitions and exact targets disclose below. */
.resource-meters{display:grid;gap:4px;padding:4px}
.resource-meter{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1fr) auto;align-items:center;gap:6px;font-size:.85em}
.resource-meter meter{width:100%;min-width:0}.resource-meter>span:last-child{justify-self:end}
.menu .tqp a.tqp-mark{display:inline-flex;align-items:center;justify-content:center;padding:0}
.tqp-mark[aria-disabled=true]{opacity:.65}
/* Long host/admission summaries get the row width instead of a narrow trailing column. */
.menu .settings-widget.project:is([data-route=hosts],[data-a=work],[data-operation=admission]){display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px}
.menu .settings-widget.project:is([data-route=hosts],[data-a=work],[data-operation=admission])>.meta{grid-column:2;margin-left:0;text-align:left}
/* The workspace overflow belongs to the header, so its menu cannot extend left of a narrow window. */
.menu.workspace .head{position:relative}.menu.workspace .shell-overflow{position:static}
.menu.workspace .overflow-actions{inset-inline-end:var(--outer)}

/* #1573 conversation-walkthrough: task-dominant dashboard, shared tokens and anchored controls. */
/* #1659 R06/R41: dividers are Text 8% over Surface; the popover is opaque and raised with its own edge and shadow. */
.menu{--divider:color-mix(in srgb,light-dark(#243039,#eef2f5) 8%,var(--surface));--popover:light-dark(#ffffff,#323b45);--popover-edge:#8996a2}
.ui-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1em;height:1em;vertical-align:-.12em}
.ui-icon svg{width:100%;height:100%}.ui-icon svg:not([fill]){fill:currentColor}
.menu:not(.workspace) .head{gap:3px}
.menu:not(.workspace) .head .nav-actions{gap:1px}.head button{border-color:transparent}
.menu:not(.workspace) .head .window-controls{padding-left:2px}
.menu .project:has(>.ui-icon){display:flex;gap:8px;white-space:normal}
.menu .project>span:first-child{white-space:normal;overflow-wrap:anywhere;overflow:visible}
.dashboard-status{border-bottom:1px solid var(--divider);padding-bottom:3px}.dashboard-status>summary{font-size:.85em;min-height:32px}
