const I=n=>stateAssets[n]?`<span class="sr-brand" style="--sr-brand-mask:url('${stateAssets[n]}')" aria-hidden="true"></span>`:`<i data-lucide="${n}" aria-hidden="true"></i>`;
const brand=n=>`<span class="sr-brand" style="--sr-brand-mask:url('${assets[n]}')" aria-hidden="true"></span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const version='0.0.0-example';
const projects=['agentq','coreq','dashq','serverq','specq','taskq','pilotq'];
const modes=[['off','bell-off','Off'],['silent','inbox','Silent'],['banner','panel-top','Banner'],['sound','volume-2','Banner + sound']];
const initial={font:18,tray:'summary',growth:'up',notifications:{Question:'sound',Closed:'banner',Failed:'banner','Attempt gone':'banner'},top:{},wide:null,bin:0,open:[],projectFocus:null};
let state=structuredClone(initial);
function restore(s){if(s?.prototype!=='settings-review')return;state=structuredClone(initial);if([14,16,18,20].includes(s.font))state.font=s.font;if(['icon','summary'].includes(s.tray))state.tray=s.tray;if(['auto','down','up','fixed'].includes(s.growth))state.growth=s.growth;if(s.notifications)for(const k of Object.keys(initial.notifications))if(modes.some(x=>x[0]===s.notifications[k]))state.notifications[k]=s.notifications[k];if(s.top&&typeof s.top==='object')state.top=s.top;if(Number.isInteger(s.bin)&&s.bin>=0&&s.bin<6)state.bin=s.bin;state.open=Array.isArray(s.open)?s.open.filter(x=>typeof x==='string'):[];state.wide=typeof s.wide==='string'?s.wide:null;state.projectFocus=typeof s.projectFocus==='string'&&/^(dashq|taskq|pilotq):(Doing|Review|Held|Later|Blocked)$/.test(s.projectFocus)?s.projectFocus:null;}
restore(window.openai?.widgetState?.privateContent);
function persist(){window.openai?.setWidgetState({modelContent:{prototype:'settings-review',screen:state.wide||'all',font:state.font,growth:state.growth,tray:state.tray},privateContent:{prototype:'settings-review',...state}})?.catch(()=>{});}
const btn=(icon,label,data='',extra='')=>`<button type="button" class="sr-icon cursor-interaction" aria-label="${label}" data-tooltip="${label}" ${data} ${extra}>${I(icon)}</button>`;
const board=p=>`<a class="sr-inline" href="https://github.com/taskqorg/${p}/issues" target="_blank" rel="noreferrer" aria-label="Open ${p} board" data-tooltip="${p} · Board">${brand('github')}</a>`;
const disclose=(id,label,content)=>`<details data-detail="${id}" ${state.open.includes(id)?'open':''}><summary class="cursor-interaction">${label}</summary><div class="sr-detail">${content}</div></details>`;
function frame(id,title,body){return `<article class="sr-window ${state.wide===id?'sr-wide':''}" id="sr-${id}" aria-label="${title}"><header class="sr-head">${btn('house','Settings home','data-jump="settings"')}<h2>${title}</h2><button class="sr-icon sr-topmost cursor-interaction" data-top="${id}" aria-label="Always on top · ${title}" aria-pressed="${!!state.top[id]}" data-tooltip="Always on top">${I('copy')}</button>${btn(state.wide===id?'minimize-2':'maximize-2','Enlarge or restore '+title,`data-wide="${id}"`)}${btn('x','Close '+title,'','disabled')}</header><div class="sr-content">${body}</div><footer class="sr-footer">v${version}<span class="sr-grip" aria-hidden="true"></span></footer></article>`;}
function context(t){return `<div class="sr-context">${t}</div>`;}
const jump=(id,label,icon)=>`<button class="cursor-interaction" data-jump="${id}">${I(icon)}${label}</button>`;
function settings(){return context('mac · 7 projects')+`<div class="sr-label">Work</div><div class="sr-nav">${jump('hosts','Hosts & resources','server')}${jump('work','Work mode','sliders-horizontal')}${jump('agents','Agents & access','bot')}${jump('projects','Projects','folder')}${jump('delivery','Delivery','git-pull-request')}${jump('services','Services','activity')}</div><div class="sr-label">Personal</div><div class="sr-nav">${jump('appearance','Appearance','type')}${jump('notifications','Notifications','bell')}</div><div class="sr-label">History & support</div><div class="sr-nav">${jump('history','Activity','chart-no-axes-column')}${jump('recovery','Recovery','rotate-ccw')}${jump('about','About & updates','info')}</div>`;}
function theme(){return Number(getComputedStyle(root.querySelector('.sr-window')||root).backgroundColor.match(/\d+/)?.[0])<128?'dark':'light';}
function appearance(){return context('System appearance · personal preferences')+`<div class="sr-label">Text</div><div class="sr-select">${[14,16,18,20].map(n=>`<button data-font="${n}" aria-pressed="${state.font===n}">${n} px</button>`).join('')}</div><div class="sr-label">Tray</div><div class="sr-select">${['icon','summary'].map(t=>`<button data-tray="${t}" aria-pressed="${state.tray===t}">${t==='icon'?'<img class="sr-preview-icon" data-image="icon" alt="Compact q">':'<canvas class="sr-preview-icon" data-summary aria-label="Snapshot: work 2, answers 0, ready 0"></canvas>'}${t==='icon'?'Icon':'Summary'}</button>`).join('')}</div><div class="sr-label">Window growth</div><div class="sr-growth">${[['auto','Auto'],['down','Down'],['up','Up'],['fixed','Fixed']].map(([v,l])=>`<button data-growth="${v}" aria-pressed="${state.growth===v}"><span class="sr-mini ${v==='up'?'up':v==='fixed'?'fixed':''}" aria-hidden="true"><i></i></span>${l}</button>`).join('')}</div><div class="sr-note">Auto follows the actual opening direction.</div><div class="sr-row sr-small"><span>${I('pin')} Keep menu open</span><span class="sr-value">On</span></div><div class="sr-row sr-small"><span>${I('copy')} Always on top</span><span class="sr-value">Off</span></div>`;}
const count=(rt,n)=>`<span class="sr-count" aria-label="${rt==='claude'?'Claude':'Codex'} ${n==='—'?'unknown':n}" data-tooltip="${rt==='claude'?'Claude':'Codex'} · ${n==='—'?'unknown':n}">${brand(rt)}${n}</span>`;
function metric(icon,label,value,percent){return `<div class="sr-metric"><span class="sr-inline">${I(icon)}${label}</span>${percent===null?'<span class="sr-muted">—</span>':`<span class="sr-track"><i style="width:${percent}%"></i></span>`}<span class="sr-value">${value}</span></div>`;}
function hosts(){return context('Running-agent observation · at capture')+`<div class="sr-hostline"><span>sample-remote-host ${count('claude','—')}${count('openai','—')}</span><span>mac ${count('claude','—')}${count('openai','—')}</span><span>win ${count('claude','—')}${count('openai','—')}</span></div>`+disclose('host-observation','Host observations',`<div class="sr-row"><span>sample-remote-host</span><span class="sr-value">Idle · runtime split unavailable</span></div><div class="sr-row"><span>mac</span><span class="sr-value">Unknown · sample 5m old</span></div><div class="sr-row"><span>win</span><span class="sr-value">Unknown · sample 2m old</span></div>`)+`<div class="sr-label">mac · separate resource sample</div>${metric('cpu','CPU','42%',42)}${metric('memory-stick','Available memory','35%',35)}<div class="sr-note">Resource sample was sample freshness.</div>`+disclose('host-counts','Slots, reservations & board counts',`<div class="sr-row"><span>Occupied slots · mac</span><span class="sr-value">${brand('claude')} 1 · &lt;1m old</span></div><div class="sr-row"><span>Reservations</span><span class="sr-value">None · remote unknown</span></div><div class="sr-row"><span>Board tasks</span><span class="sr-value">Doing 1 · Review 1</span></div>Process observations, occupied slots and board states are separate sources.`)+`<div class="sr-actions">${jump('work','Work mode','sliders-horizontal')}</div>`;}
function work(){return context('mac · all 7 registered projects')+`<div class="sr-err">${I('shield-alert')}<div><strong>Admission blocked</strong><div class="sr-small">Access gate · load gate Ready</div></div></div><div class="sr-row"><span>Host maximum</span><span class="sr-value">8</span></div><div class="sr-label">Occupied slots / policy caps</div><div class="sr-row"><span class="sr-inline">${brand('claude')}Claude</span><span class="sr-track sr-cap"><i style="width:${100/6}%"></i></span><span class="sr-nowrap sr-small">1 / 6</span></div><div class="sr-row"><span class="sr-inline">${brand('openai')}Codex</span><span class="sr-value sr-small">Unknown / 4</span></div><div class="sr-row"><span class="sr-inline">${brand('openai')}Codex app</span><span class="sr-value sr-small">Unknown / no cap</span></div>`+disclose('work-resources','Resources & freshness',`${metric('cpu','CPU','42%',42)}${metric('memory-stick','Available memory','35%',35)}Sample was sample freshness. No total utilization bar: runtime usage is incomplete.`)+disclose('work-scope','Scope · 7 projects',projects.join(' · ')+'<br>Project ceilings: agentq — none. Other project ceilings were not inspected. Host limits affect every registered project.')+`<div class="sr-actions">${jump('agents','Review access','shield')}<button disabled data-tooltip="Native limit editing is not connected in this review">${I('sliders-horizontal')}Edit limits</button></div>`;}
const capturedAgents=[{id:'claude',icon:'claude',name:'Claude',version:'0.0.0-example',account:'sample@example.invalid',method:null},{id:'codex',icon:'openai',name:'Codex',version:'0.0.0-example',account:null,method:'ChatGPT'},{id:'codex-app',icon:'openai',name:'Codex app',version:'0.0.0-example',account:null,method:'ChatGPT'}];
function agents(){return context('mac · runtime probe · sample freshness')+`<div class="sr-row"><span>Host worker · AgentQ</span><span class="sr-value sr-small">Running · 0.0.0-example</span></div>${capturedAgents.map(r=>`<section class="sr-auth-runtime" aria-label="${r.name} version and sign-in"><div class="sr-row"><span class="sr-inline">${brand(r.icon)}<strong>${r.name}</strong></span><span class="sr-value sr-small">${r.version}</span></div><div class="sr-auth-line"><span class="sr-inline sr-small" data-tooltip="${r.account||'The source reports the login method, not the account identity'}">${I('user-round')}${r.account||'Account unknown'}</span><span class="sr-inline sr-small sr-work">${I('badge-check')}Signed in¹</span></div><div class="sr-auth-line sr-small sr-muted"><span class="sr-inline">${I('clock')}Expiry unknown</span>${r.method?`<span>${r.method}</span>`:''}</div>${disclose('auth-'+r.id,'Login details',`<div class="sr-row"><span>Observed login</span><span class="sr-value">Signed in · at capture</span></div><div class="sr-row"><span>Account</span><span class="sr-value">${r.account||'Unknown'}</span></div><div class="sr-row"><span>Expiration</span><span class="sr-value">Not supplied</span></div><div class="sr-row"><span>Last refresh</span><span class="sr-value">Not captured</span></div>${r.id==='codex-app'?'<div>Inspected adapter shares Codex binary/login; host profile must match.</div>':''}<div class="sr-actions"><button disabled data-tooltip="No new authentication probe runs in this snapshot">${I('refresh-cw')}Check login</button><button disabled data-tooltip="Sign-in requires the supported native flow">${I('log-in')}Sign in…</button></div>`)}</section>`).join('')}<div class="sr-note">¹ Synthetic sign-in example · not a real account or validity check.</div>`+disclose('agent-remote','Other workers',`<div class="sr-row"><span>win</span><span class="sr-value">Version / account / login unknown</span></div><div class="sr-row"><span>sample-remote-host</span><span class="sr-value">Version / account / login unknown</span></div>No remote authentication probe was captured. Idle/running observations do not establish login validity.`)+`<div class="sr-label">Runtime access</div><div class="sr-err">${I('shield-alert')}<span class="sr-small">Effective access unconfirmed</span></div>`+disclose('agent-source','Access details','Requested / saved / effective access were not provided. Authentication does not establish runtime permissions. The installed Access destination currently returns to Agents.')+`<div class="sr-actions"><button disabled data-tooltip="A working readback adapter is required">${I('shield')}Review permissions</button></div>`;}

const taskCounts={dashq:[['clock','Later',1]],taskq:[['git-pull-request','Review',1],['circle-pause','Held',1]],pilotq:[['play','Doing',1],['link','Blocked',1]]};
const observedTasks=[['pilotq',25,'Doing','Key grants by project; one tool-call budget per request across retries'],['taskq',1654,'Review','Hourly worktree tidy, root fast-forward on main, health report'],['pilotq',26,'Blocked','Step 5: agentq qualification, full case matrix, seven-day pilot start'],['dashq',187,'Later','Qualify the operator redesign end to end on live sources'],['taskq',802,'Held','Promo video A: scene, timing, style and voice approval package']];
function projectDrilldown(){if(!state.projectFocus)return '';const [project,status]=state.projectFocus.split(':');return `<div class="sr-label">${project} · ${status}</div>${observedTasks.filter(t=>t[0]===project&&t[2]===status).map(t=>`<div class="sr-policy sr-small"><a href="https://github.com/taskqorg/${t[0]}/issues/${t[1]}" target="_blank" rel="noreferrer">#${t[1]} · ${t[3]}</a></div>`).join('')}`;}
function projectList(){return context('mac · admission requested: all · 5 open tasks')+projects.map(p=>`<div class="sr-policy"><span class="sr-name sr-inline">${I('folder')}${p}</span><span class="sr-project-counters">${(taskCounts[p]||[]).map(([i,n,v])=>`<button class="sr-pill cursor-interaction" style="${n==='Review'?'color:var(--sr-review)':''}" data-project-tasks="${p}:${n}" aria-label="${p} ${n} ${v}" aria-pressed="${state.projectFocus===p+':'+n}" data-tooltip="${n}">${I(i)}${v}</button>`).join('')}</span>${board(p)}</div>`).join('')+projectDrilldown()+disclose('project-intent','Admission & original request','Admitting: all is recorded for each project; this does not prove effective host admission. The same original instruction repeats across six projects. pilotq has no recorded original request.')+`<div class="sr-actions"><button disabled data-tooltip="Native project setup is outside this review">${I('plus')}Add project</button></div>`;}
function delivery(){return context('Project publication policy')+projects.map(p=>`<div class="sr-policy"><span class="sr-name">${p}</span><span class="sr-policy-state">${I('git-merge')}Auto-merge</span>${board(p)}</div>`).join('')+disclose('delivery-authority','Policy revision & approval','All seven displayed project policies reported revision 0. Publication remains governed by exact-candidate approval and board authority. Runtime access is a separate control.');}
const incidents=[['agentq','dispatch.start',1281,'3d'],['coreq','dispatch.panic',873,'9d'],['dashq','update.rollback',963,'9d'],['serverq','update.smoke',1262,'7d'],['specq','invariant.double_attempt',1137,'8d'],['taskq','invariant.label_loop',1501,'1d']];
function services(){return context('mac · one observed host process')+`<div class="sr-row"><span class="sr-inline sr-work">${I('activity')}Running</span><span class="sr-value sr-small">PID example</span></div><div class="sr-row sr-small"><span>Observed at capture</span><span class="sr-value">Fresh · &lt;1m</span></div><div class="sr-row sr-small"><span>Registered projects</span><span class="sr-value">7</span></div><div class="sr-label">Recorded incidents · 6</div>${incidents.map(([p,t,id,a])=>`<div class="sr-policy"><span class="sr-name">${p}</span><span class="sr-policy-state">Sent · ${a}</span><a class="sr-inline sr-small" href="https://github.com/taskqorg/taskq/issues/${id}" target="_blank" rel="noreferrer" data-tooltip="${t}">#${id}${I('external-link')}</a></div>`).join('')}<div class="sr-row sr-small"><span>pilotq</span><span class="sr-value">No recorded incident</span></div>`+disclose('service-actions','Logs & service operations','One observed host PID serves the registered projects. Project incidents remain separate records; “sent” does not mean an incident is currently open.<div class="sr-actions"><button disabled>Open log</button><button disabled>Open folder</button><button disabled>Review operations</button></div>');}
function notifications(){return context(`${I('bell')}OS notifications allowed`)+`<div class="sr-legend">${modes.map(([,i,n])=>`<span>${I(i)}${n}</span>`).join('')}</div>${Object.keys(initial.notifications).map(k=>`<div class="sr-notifyrow"><span>${k}</span><span class="sr-modes" role="group" aria-label="${k} notification mode">${modes.map(([v,i,n])=>`<button class="cursor-interaction" data-notify="${esc(k)}" data-mode="${v}" aria-label="${k} · ${n}" data-tooltip="${n}" aria-pressed="${state.notifications[k]===v}">${I(i)}</button>`).join('')}</span>${btn('play','Test '+k,'','disabled')}</div>`).join('')}<div class="sr-note">Choices preview locally. No test is sent.</div>`;}
const bins=[{closed:1,blocked:0},{closed:0,blocked:0},{closed:1,blocked:0},{closed:0,blocked:1},{closed:0,blocked:0},{closed:0,blocked:0}];
function history(){const b=bins[state.bin],start=['11:40','11:50','12:00','12:10','12:20','12:30'][state.bin],end=['11:50','12:00','12:10','12:20','12:30','12:40'][state.bin];return context('23 Oct · 11:40–12:40 · Asia/Bangkok')+`<div class="sr-legend"><span class="sr-work">${I('check-check')}Closed 2</span><span>${I('circle-x')}Failed 0</span><span>${I('message-circle-question')}Ask 0</span><span>${I('link')}Blocked 1</span></div><div class="sr-events" role="group" aria-label="Six ten-minute event bins, scale zero to one event">${bins.map((v,i)=>`<button class="sr-bin cursor-interaction" data-bin="${i}" aria-pressed="${state.bin===i}" aria-label="${['11:40','11:50','12:00','12:10','12:20','12:30'][i]}: closed ${v.closed}, blocked ${v.blocked}"><span class="sr-bin-plot">${v.closed||v.blocked?`<i class="sr-event-fill ${v.blocked?'blocked':''}"></i>`:''}</span><span>${[':40',':50',':00',':10',':20',':30'][i]}</span></button>`).join('')}</div><div class="sr-small">${start}–${end} · closed ${b.closed} · blocked ${b.blocked}</div>`+disclose('activity-definition','Interval & event definitions','Six equal ten-minute bins; peak 1 event. Last interval was ongoing at capture. Ask/blocked count events, not current task states. Dates and ages are frozen from the review snapshot.')+`<div class="sr-rule"></div><div class="sr-label">Completed tasks</div><div class="sr-small sr-muted">2 closure events · task records not loaded</div><div class="sr-actions"><button disabled data-tooltip="The snapshot contains events, not completed task records">${I('history')}Browse completed tasks</button></div>`;}
function recovery(){return context('mac · reviewed recovery')+`<div class="sr-err">${I('circle-help')}<div><strong>taskq · read unconfirmed</strong><div class="sr-small">No recovery outcome established</div></div></div><div class="sr-actions">${board('taskq')}<span class="sr-small">Inspect board</span><button disabled data-tooltip="A fresh native read is required">${I('rotate-cw')}Read again</button></div><div class="sr-rule"></div>${projects.filter(p=>p!=='taskq').map(p=>`<div class="sr-recovery-grid"><span>${p}</span><span class="sr-muted">Not read</span></div>`).join('')}`+disclose('recovery-scope','Scope & effect review','Only the taskq read was exercised. Source message: Recovery read or write unconfirmed; inspect the board and reconcile the same selection. Unknown effects stay held. Resume/restart remains unavailable until exact task and effect review.');}
function about(){return context('mac · observed version reports')+`<div class="sr-row"><span>TaskQ tray</span><span class="sr-value sr-small sr-version">${version}</span></div><div class="sr-row"><span>Project reports</span><span class="sr-value sr-small">7 matching versions</span></div>`+disclose('about-versions','Expand 7 reports',projects.map(p=>`<div class="sr-row"><span>${p}</span><span class="sr-value">${version}</span></div>`).join('')+'Each report was &lt;1m old at capture. Equal version strings alone do not establish common process identity.')+`<div class="sr-row"><span>AgentQ</span><span class="sr-value sr-small">0.0.0-example</span></div><div class="sr-rule"></div><div class="sr-row sr-small"><span>Available update</span><span class="sr-value sr-muted">Not checked</span></div><div class="sr-actions"><button disabled data-tooltip="Update checks and installation are outside this review">${I('download')}Review updates</button></div>`;}
const screens=[['settings','Settings',settings],['appearance','Appearance',appearance],['hosts','Hosts & resources',hosts],['work','Work mode',work],['agents','Agents & access',agents],['projects','Projects',projectList],['delivery','Delivery',delivery],['services','Services',services],['notifications','Notifications',notifications],['history','Activity',history],['recovery','Recovery',recovery],['about','About & updates',about]];
console.assert(capturedAgents.length===3&&capturedAgents.filter(r=>r.account).length===1&&capturedAgents.filter(r=>r.method==='ChatGPT').every(r=>r.account===null),'Login method never invents an account identity');
console.assert(observedTasks.length===5&&observedTasks.filter(t=>t[2]==='Doing'||t[2]==='Review').length===2,'Summary uses observed board work, not process counts');
console.assert(projects.length===7&&screens.length===12&&bins.reduce((n,b)=>n+b.closed,0)===2&&bins.reduce((n,b)=>n+b.blocked,0)===1,'Review evidence scope and event counts');
// Reuse I1-I3 numeral placement from square-summary-reference.html; values are captured board counts.
function drawSummary(){const cv=root.querySelector('[data-summary]');if(!cv)return;const n=32,dpr=2,values=[2,0,0],c=cv.getContext('2d');cv.width=n*dpr;cv.height=n*dpr;c.scale(dpr,dpr);const colors=['--sr-work','--sr-ask','--sr-muted','--sr-fail'].map((token,i)=>{const probe=document.createElement('span');probe.style.color='var('+token+')';root.append(probe);const color=getComputedStyle(probe).color;probe.remove();return color;});const outer=.5,gap=1.5,left=outer,right=n-outer,mid=n/2,cellW=(n-2*outer-gap)/2,rowH=cellW;let font=n*.72,m;const measure=()=>{c.font='500 '+font+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';return values.map(v=>c.measureText(String(v)));};for(m=measure();font>2;){if(m.every(t=>t.actualBoundingBoxLeft+t.actualBoundingBoxRight<=cellW)&&Math.max(m[0].actualBoundingBoxAscent,m[1].actualBoundingBoxAscent)+Math.max(m[0].actualBoundingBoxDescent,m[1].actualBoundingBoxDescent)<=rowH&&m[2].actualBoundingBoxAscent+m[2].actualBoundingBoxDescent<=rowH)break;font-=.1;m=measure();}const top=outer+Math.max(m[0].actualBoundingBoxAscent,m[1].actualBoundingBoxAscent),bottom=n-outer-m[2].actualBoundingBoxDescent;values.forEach((v,i)=>{c.fillStyle=colors[i];c.fillText(String(v),i===1?right-m[i].actualBoundingBoxRight:left+m[i].actualBoundingBoxLeft,i===2?bottom:top);});const gx=Math.ceil((mid+gap/2)*dpr),gy=Math.ceil((bottom-m[2].actualBoundingBoxAscent)*dpr),edge=(n-outer)*dpr,barGap=1,bw=Math.floor((edge-gx-5*barGap)/6),x0=edge-6*bw-5*barGap;c.save();c.setTransform(1,0,0,1,0,0);bins.forEach((b,i)=>{if(!b.closed&&!b.blocked)return;c.fillStyle=b.blocked?colors[2]:colors[0];c.fillRect(x0+i*(bw+barGap),gy,bw,edge-gy);});c.restore();cv.setAttribute('role','img');}
function hydrate(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}});const t=theme();for(const image of root.querySelectorAll('[data-image]'))image.src=qAssets[t];drawSummary();}
function render(){root.style.setProperty('--sr-size',state.font+'px');root.querySelector('[data-type]').textContent=state.font+' px · separate captures';root.querySelector('[data-screens]').innerHTML=screens.map(([id,t,body])=>frame(id,t,body())).join('');hydrate();}
function note(text){root.querySelector('.sr-review-status').textContent=text;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.jump){root.querySelector('#sr-'+d.jump)?.scrollIntoView({behavior:'auto',block:'start'});return;}if(d.wide){state.wide=state.wide===d.wide?null:d.wide;render();root.querySelector('#sr-'+d.wide)?.scrollIntoView({behavior:'auto',block:'start'});persist();return;}if(d.top){state.top[d.top]=!state.top[d.top];b.setAttribute('aria-pressed',String(state.top[d.top]));persist();return;}if(d.font){state.font=Number(d.font);render();root.querySelector(`[data-font="${state.font}"]`)?.focus({preventScroll:true});persist();note('Preview text size changed · installed preference unchanged');return;}if(d.tray){state.tray=d.tray;render();persist();note('Preview tray selection changed · installed preference unchanged');return;}if(d.growth){state.growth=d.growth;render();persist();note('Preview growth selection changed · installed preference unchanged');return;}if(d.projectTasks){state.projectFocus=state.projectFocus===d.projectTasks?null:d.projectTasks;render();root.querySelector(`[data-project-tasks="${d.projectTasks}"]`)?.focus({preventScroll:true});persist();return;}if(d.notify){state.notifications[d.notify]=d.mode;render();persist();note('Preview notification mode changed · no notification sent');return;}if(d.bin!==undefined){state.bin=Number(d.bin);render();persist();return;}});
root.addEventListener('toggle',e=>{const id=e.target.dataset?.detail;if(!id||e.target.open===state.open.includes(id))return;state.open=e.target.open?[...new Set([...state.open,id])]:state.open.filter(x=>x!==id);persist();},true);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.prototype==='settings-review'){restore(s);render();}});
render();
if(globalThis.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',hydrate);
})();
</script>
