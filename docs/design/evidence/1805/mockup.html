<script>
const q=new URLSearchParams(location.search),variant=q.get('variant')==='b'?'b':'a';document.documentElement.style.colorScheme=q.get('theme')==='light'?'light':'dark';document.body.classList.add('variant-'+variant);document.querySelector('#variant-title').textContent=variant==='a'?'A · Compact band (recommended)':'B · Counts below name';document.querySelector('#tradeoff').textContent=variant==='a'?'Counts share the name line when they fit; wrap under it at narrow widths.':'Counts always have their own line: steadier alignment, taller groups.';
const projects=[{id:'taskq',name:'taskq',kind:'github',shown:2,total:4,rows:[[1805,'Menu project groups: clear header, counters and collapse'],[1799,'Keep the complete task title readable at larger text sizes']]},{id:'agentq',name:'agentq',kind:'gitlab',shown:2,total:2,rows:[[120,'Preserve the active session on reconnect'],[121,'Report unavailable telemetry explicitly']]},{id:'long',name:'Infrastructure-and-agent-workflow-qualification',kind:'github',shown:1,total:1200,closed:true,rows:[[122,'Review the complete qualification report']]},{id:'unknown',name:'unavailable-project',kind:'github',shown:'?',total:'?',closed:true,rows:[],reason:'Tasks unknown · last snapshot unavailable'}];
function icon(n){return '<span class="ui-icon" aria-hidden="true">'+document.querySelector('#icon-'+n).innerHTML+'</span>'}
for(const p of projects){let closed=p.closed;try{const saved=localStorage.getItem('taskq-1805:'+variant+':'+p.id);if(saved!==null)closed=saved==='true'}catch{}const section=document.createElement('section');section.className='project-preview';section.dataset.project=p.id;section.innerHTML='<header class="group-header"><button class="preview-action toggle" aria-label="'+(closed?'Expand ':'Collapse ')+p.name+' tasks" aria-controls="rows-'+p.id+'" aria-expanded="'+!closed+'">'+icon('arrow-down')+'</button><div class="group-heading"><button class="group-name" data-destination="Project overview: '+p.name+'">'+p.name+'</button><span class="counts" title="'+(p.reason||'Matches the current filter; total open tasks')+'" aria-label="'+(p.reason?'Matching and total task counts unknown: '+p.reason:p.shown+' tasks match the current filter; '+p.total+' open tasks in total')+'"><span>'+p.shown+' shown</span><span>· '+p.total+' total</span></span></div><div class="group-actions"><button class="preview-action" data-destination="'+p.kind+' board: '+p.name+'" aria-label="Open '+p.name+' board on '+p.kind+'">'+icon(p.kind)+'</button><button class="preview-action" data-destination="Registered project folder: '+p.name+'" aria-label="Open '+p.name+' project folder on this computer">'+icon('folder')+'</button></div></header><div class="group-rows" id="rows-'+p.id+'"'+(closed?' hidden':'')+'>'+p.rows.map(([n,title])=>'<div class="task-row"><div class="task-meta">'+icon('circle')+icon(p.kind)+'<span>#'+n+'</span><time>5m</time></div><div class="task-title">'+title+'</div></div>').join('')+''+(p.reason?'<p class="note" role="status">'+p.reason+'</p>':'')+'</div>';section.querySelector('.toggle').onclick=e=>{const b=e.currentTarget,closed=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!closed));b.setAttribute('aria-label',(closed?'Expand ':'Collapse ')+p.name+' tasks');section.querySelector('.group-rows').hidden=closed;try{localStorage.setItem('taskq-1805:'+variant+':'+p.id,String(closed))}catch{}};document.querySelector('#groups').append(section)}
for(const el of document.querySelectorAll('[data-icon]'))el.innerHTML=document.querySelector('#icon-'+el.dataset.icon).innerHTML;
for(const b of document.querySelectorAll('[data-variant]'))b.onclick=()=>{q.set('variant',b.dataset.variant);location.search=q.toString()};document.querySelector('#theme').onclick=()=>document.documentElement.style.colorScheme=document.documentElement.style.colorScheme==='dark'?'light':'dark';const dialog=document.querySelector('dialog');for(const b of document.querySelectorAll('[data-destination]'))b.onclick=()=>{document.querySelector('#destination').textContent='Simulated destination · '+b.dataset.destination;dialog.showModal()};document.querySelector('#back').onclick=()=>dialog.close();
</script></body></html>
