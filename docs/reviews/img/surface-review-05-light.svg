xt><text x="797" y="802" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#536171">Presence only; exact count in History.</text><text x="797" y="831" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#536171">No real failed example in available cache.</text><text x="797" y="876" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#243039">Click detail keeps all four event kinds.</text><text x="797" y="907" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#243039">Selecting a bin does not open another page.</text><text x="797" y="951" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#536171">Zero and unknown are different marks.</text><text x="797" y="980" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#536171">Unknown counts never enter the height peak.</text><text x="797" y="1009" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#536171">Current task counters are separate.</text><text x="24" y="1108" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#243039">Geometry proposal: counters baseline 9 pt; columns x = 1 + 3.5i, width 2.5 pt, baseline 20.5 pt, max height 9 pt.</text><text x="24" y="1138" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#536171">Known zero: 0.5 pt tick; unknown: 0.75 pt dash; ongoing: 0.5 pt underline at y = 21 pt. No new threshold behavior.</text><text x="24" y="1170" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#536171">Illustrations only: native font/DPI, multi-digit overflow, pause and failed readability remain implementation qualification.</text></svg>